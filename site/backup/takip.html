* { margin: 0; padding: 0; box-sizing: border-box; }

body {

.container {

.search-box {

}

.search-input:focus {

.btn {

}

.btn-primary:hover {

#trackingResult {

}

}

.tracking-header {

.timeline {

.timeline-item {

}

.timeline-item:last-child {

}

.timeline-item::before {
  content: '';
  position: absolute;
  left: -29px;
  top: 0;
  bottom: -30px;
  width: 2px;
  background: var(--border);
}

.timeline-item:last-child::before {
  display: none;
}

.timeline-dot {
  position: absolute;
  left: -36px;
  top: 4px;
  width: 16px;
  height: 16px;
  border-radius: 50%;
  background: var(--surface);
  border: 3px solid var(--border);
}

.timeline-item.active .timeline-dot {

.timeline-content h4 {

.alert {

.alert-info {

.alert-success {

.alert-error {

.loading {

@keyframes spin {

.pulse {

@keyframes pulse {

@media (max-width: 768px) {

    flex-direction: column;
  }
  
  #map {
    height: 350px;
  }
  
  .order-info {
    grid-template-columns: 1fr;
  }
}
</style>
