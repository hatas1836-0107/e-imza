<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kurye Paneli | Zirve E-İmza</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

:root {
  --primary: #4f46e5;
  --secondary: #7c3aed;
  --success: #22c55e;
  --danger: #f43f5e;
  --warning: #f59e0b;
  --bg: #0a0e1a;
  --surface: rgba(255,255,255,0.06);
  --border: rgba(255,255,255,0.1);
  --text: #f8fafc;
  --text-muted: #94a3b8;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Inter', -apple-system, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
}

body::before {
  content: '';
  position: fixed;
  inset: 0;
  background: 
    radial-gradient(circle at 20% 20%, rgba(79,70,229,0.15), transparent 50%),
    radial-gradient(circle at 80% 80%, rgba(124,58,237,0.15), transparent 50%);
  pointer-events: none;
}

.container {
  max-width: 1200px;
  margin: 0 auto;
  padding: 20px;
  position: relative;
}

/* Login */
.login-screen {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
}

.login-card {
  background: var(--surface);
  backdrop-filter: blur(20px);
  border: 1px solid var(--border);
  border-radius: 24px;
  padding: 48px;
  width: 100%;
  max-width: 440px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.4);
}

.brand-mark {
  width: 80px;
  height: 80px;
  background: linear-gradient(135deg, var(--primary), var(--secondary));
  border-radius: 20px;
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 0 auto 24px;
}

.brand-mark svg {
  width: 40px;
  height: 40px;
  color: white;
}

.login-card h1 {
  font-size: 2rem;
  text-align: center;
  margin-bottom: 8px;
  background: linear-gradient(135deg, var(--primary), var(--secondary));
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}

.login-card p {
  text-align: center;
  color: var(--text-muted);
  margin-bottom: 32px;
}

.form-group {
  margin-bottom: 20px;
}

.form-group label {
  display: block;
  margin-bottom: 8px;
  font-weight: 600;
  font-size: 0.9rem;
  color: var(--text-muted);
}

.form-group input {
  width: 100%;
  padding: 14px 16px;
  background: rgba(255,255,255,0.05);
  border: 1px solid var(--border);
  border-radius: 12px;
  color: var(--text);
  font-size: 1rem;
  transition: all 0.3s;
}

.form-group input:focus {
  outline: none;
  border-color: var(--primary);
  background: rgba(255,255,255,0.08);
  box-shadow: 0 0 0 4px rgba(79,70,229,0.1);
}

.btn {
  padding: 14px 24px;
  border: none;
  border-radius: 12px;
  font-size: 1rem;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.3s;
}

.btn-primary {
  background: linear-gradient(135deg, var(--primary), var(--secondary));
  color: white;
  width: 100%;
  box-shadow: 0 8px 24px rgba(79,70,229,0.3);
}

.btn-primary:hover {
  transform: translateY(-2px);
  box-shadow: 0 12px 32px rgba(79,70,229,0.4);
}

/* Dashboard */
.dashboard {
  display: none;
}

.dashboard.active {
  display: block;
}

.dash-header {
  background: var(--surface);
  backdrop-filter: blur(20px);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 24px;
  margin-bottom: 24px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.dash-header h1 {
  font-size: 1.8rem;
  margin-bottom: 4px;
}

.btn-ghost {
  background: transparent;
  border: 1px solid var(--border);
  color: var(--text);
  padding: 10px 20px;
  border-radius: 10px;
}

.btn-ghost:hover {
  background: var(--danger);
  border-color: var(--danger);
}

/* Location Status */
.location-status {
  background: var(--surface);
  border: 2px solid var(--border);
  border-radius: 16px;
  padding: 20px 24px;
  display: flex;
  align-items: center;
  gap: 16px;
  margin-bottom: 24px;
  transition: all 0.3s;
}

.location-status.active {
  border-color: var(--success);
  background: rgba(34,197,94,0.1);
  box-shadow: 0 8px 32px rgba(34,197,94,0.2);
}

.location-dot {
  width: 16px;
  height: 16px;
  border-radius: 50%;
  background: var(--text-muted);
  transition: all 0.3s;
}

.location-dot.active {
  background: var(--success);
  animation: pulse-dot 2s ease-in-out infinite;
  box-shadow: 0 0 0 0 rgba(34,197,94,0.7);
}

@keyframes pulse-dot {
  0%, 100% {
    box-shadow: 0 0 0 0 rgba(34,197,94,0.7);
  }
  50% {
    box-shadow: 0 0 0 12px rgba(34,197,94,0);
  }
}

.location-status span {
  font-size: 1.05rem;
  font-weight: 600;
}

/* Delivery Button */
.delivery-btn {
  position: relative;
  width: 100%;
  padding: 24px;
  background: linear-gradient(135deg, var(--success), #16a34a);
  border: none;
  border-radius: 20px;
  color: white;
  font-size: 1.2rem;
  font-weight: 700;
  cursor: pointer;
  overflow: hidden;
  box-shadow: 0 12px 40px rgba(34,197,94,0.4);
  transition: all 0.3s;
  user-select: none;
}

.delivery-btn:hover {
  transform: translateY(-3px);
  box-shadow: 0 16px 48px rgba(34,197,94,0.5);
}

.delivery-btn.tracking {
  background: linear-gradient(135deg, var(--danger), #dc2626);
  box-shadow: 0 12px 40px rgba(239,68,68,0.4);
  animation: pulse-track 2s ease-in-out infinite;
}

@keyframes pulse-track {
  0%, 100% {
    transform: scale(1);
    box-shadow: 0 12px 40px rgba(239,68,68,0.4);
  }
  50% {
    transform: scale(1.02);
    box-shadow: 0 16px 48px rgba(239,68,68,0.6);
  }
}

.delivery-btn .progress {
  position: absolute;
  top: 0;
  left: 0;
  height: 100%;
  background: rgba(255,255,255,0.25);
  width: 0%;
  transition: width 20ms linear;
}

.delivery-btn .text {
  position: relative;
  z-index: 2;
}

/* Orders */
.section-title {
  font-size: 1.5rem;
  margin: 40px 0 20px;
  display: flex;
  align-items: center;
  gap: 12px;
}

.section-title svg {
  width: 28px;
  height: 28px;
  color: var(--primary);
}

.orders-grid {
  display: grid;
  gap: 16px;
}

.order-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 24px;
  transition: all 0.3s;
}

.order-card:hover {
  border-color: var(--primary);
  transform: translateY(-2px);
  box-shadow: 0 8px 32px rgba(79,70,229,0.2);
}

.order-card.ready {
  border-color: var(--success);
  background: rgba(34,197,94,0.05);
}

.order-header {
  display: flex;
  justify-content: space-between;
  align-items: start;
  margin-bottom: 16px;
}

.tracking-code {
  font-size: 1.3rem;
  font-weight: 700;
  color: var(--primary);
}

.badge {
  padding: 6px 14px;
  border-radius: 999px;
  font-size: 0.85rem;
  font-weight: 600;
}

.badge-ready {
  background: rgba(34,197,94,0.2);
  color: var(--success);
}

.order-details {
  display: grid;
  gap: 12px;
  margin-bottom: 16px;
}

.detail-row {
  display: flex;
  align-items: start;
  gap: 12px;
}

.detail-row svg {
  width: 20px;
  height: 20px;
  color: var(--text-muted);
  flex-shrink: 0;
  margin-top: 2px;
}

.detail-label {
  font-size: 0.9rem;
  color: var(--text-muted);
  min-width: 80px;
}

.detail-value {
  font-size: 0.95rem;
  font-weight: 500;
}

.order-actions {
  display: flex;
  gap: 12px;
  margin-top: 20px;
}

.btn-take {
  flex: 1;
  background: linear-gradient(135deg, var(--success), #16a34a);
  color: white;
  padding: 12px;
  border: none;
  border-radius: 12px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.3s;
}

.btn-take:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 24px rgba(34,197,94,0.4);
}

.loading {
  display: inline-block;
  width: 20px;
  height: 20px;
  border: 3px solid rgba(255,255,255,0.3);
  border-radius: 50%;
  border-top-color: white;
  animation: spin 0.6s linear infinite;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

.empty-state {
  text-align: center;
  padding: 60px 20px;
  color: var(--text-muted);
}

.empty-state svg {
  width: 80px;
  height: 80px;
  margin-bottom: 20px;
  opacity: 0.3;
}

@media (max-width: 768px) {
  .login-card { padding: 32px; }
  .dash-header { flex-direction: column; gap: 16px; }
  .dash-header h1 { font-size: 1.4rem; }
}
</style>
</head>
<body>

<!-- Login Screen -->
<div id="loginScreen" class="login-screen">
  <div class="login-card">
    <div class="brand-mark">
      <svg fill="currentColor" viewBox="0 0 24 24"><path d="M13 2 3 14h7l-1 8 11-14h-7l0-6Z"/></svg>
    </div>
    <h1>Kurye Paneli</h1>
    <p>Zirve E-İmza Teslimat Sistemi</p>
    
    <form id="loginForm">
      <div class="form-group">
        <label>E-posta</label>
        <input type="email" id="loginEmail" required placeholder="kurye@zirveeimza.com">
      </div>
      
      <div class="form-group">
        <label>Şifre</label>
        <input type="password" id="loginPassword" required placeholder="••••••••">
      </div>
      
      <button type="submit" class="btn btn-primary">
        <span id="loginBtnText">Giriş Yap</span>
      </button>
      
      <div id="loginMessage" style="margin-top:20px;"></div>
    </form>
  </div>
</div>

<!-- Dashboard -->
<div id="dashboard" class="dashboard">
  <div class="container">
    <div class="dash-header">
      <div>
        <h1>Kurye Paneli</h1>
        <span id="userEmail" style="color:var(--text-muted);"></span>
      </div>
      <button class="btn btn-ghost" onclick="logout()">Çıkış</button>
    </div>

    <!-- Location Status -->
    <div id="locationStatus" class="location-status">
      <div id="locationDot" class="location-dot"></div>
      <span id="locationText">Konum Paylaşımı Kapalı</span>
    </div>

    <!-- Delivery Button -->
    <button id="deliveryBtn" class="delivery-btn">
      <div class="progress"></div>
      <div class="text">Yola Çıkıyorum (Basılı Tut)</div>
    </button>

    <!-- Ready Orders -->
    <h2 class="section-title">
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg>
      Teslimata Hazır Siparişler
    </h2>
    <div id="readyOrdersContainer" class="orders-grid"></div>

    <!-- My Active Orders -->
    <h2 class="section-title" style="margin-top:48px;">
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
      Aktif Teslimatlarım
    </h2>
    <div id="myOrdersContainer" class="orders-grid"></div>
  </div>
</div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';
import { getDatabase, ref, get, set, onValue, update } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js';

const firebaseConfig = {
  apiKey: "AIzaSyADykV8-GjNNoK30CUkPlqCNMjR7Ggc1M8",
  authDomain: "e-imza-4c867.firebaseapp.com",
  databaseURL: "https://e-imza-4c867-default-rtdb.firebaseio.com",
  projectId: "e-imza-4c867",
  storageBucket: "e-imza-4c867.firebasestorage.app",
  messagingSenderId: "856535109805",
  appId: "1:856535109805:web:39f6fa2e23275f7be77624"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const database = getDatabase(app);

let currentUser = null;
let isTracking = false;
let watchId = null;
let wakeLock = null;

// Auth
onAuthStateChanged(auth, (user) => {
  if (user) {
    currentUser = user;
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('dashboard').classList.add('active');
    document.getElementById('userEmail').textContent = user.email;
    loadReadyOrders();
    loadMyOrders();
  } else {
    document.getElementById('loginScreen').style.display = 'flex';
    document.getElementById('dashboard').classList.remove('active');
  }
});

// Login
document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const email = document.getElementById('loginEmail').value;
  const password = document.getElementById('loginPassword').value;
  const btnText = document.getElementById('loginBtnText');
  const msg = document.getElementById('loginMessage');
  
  btnText.innerHTML = '<div class="loading"></div>';
  
  try {
    await signInWithEmailAndPassword(auth, email, password);
  } catch (error) {
    msg.innerHTML = `<div style="color:var(--danger);font-size:0.9rem;">Giriş başarısız: ${error.message}</div>`;
    btnText.textContent = 'Giriş Yap';
  }
});

window.logout = async () => {
  if (confirm('Çıkış yapmak istediğiniz emin misiniz?')) {
    if (isTracking) stopTracking();
    await signOut(auth);
  }
};

// Load Ready Orders (status: 'ready')
function loadReadyOrders() {
  const ordersRef = ref(database, 'orders');
  onValue(ordersRef, (snapshot) => {
    const orders = snapshot.val() || {};
    const readyOrders = Object.entries(orders)
      .filter(([_, order]) => order.status === 'ready')
      .map(([id, order]) => ({ id, ...order }));
    
    renderReadyOrders(readyOrders);
  });
}

function renderReadyOrders(orders) {
  const container = document.getElementById('readyOrdersContainer');
  
  if (orders.length === 0) {
    container.innerHTML = `
      <div class="empty-state">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0v5a2 2 0 01-2 2H6a2 2 0 01-2-2v-5m16 0h-2.586a1 1 0 00-.707.293l-2.414 2.414a1 1 0 01-.707.293h-3.172a1 1 0 01-.707-.293l-2.414-2.414A1 1 0 006.586 13H4"/></svg>
        <p>Şu anda teslimata hazır sipariş yok</p>
      </div>
    `;
    return;
  }
  
  let html = '';
  orders.forEach(order => {
    html += `
      <div class="order-card ready">
        <div class="order-header">
          <div class="tracking-code">${order.id}</div>
          <span class="badge badge-ready">✓ Hazır</span>
        </div>
        <div class="order-details">
          <div class="detail-row">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
            <div>
              <div class="detail-label">Müşteri</div>
              <div class="detail-value">${order.customerName}</div>
              <div class="detail-value" style="font-size:0.85rem;color:var(--text-muted);">${order.customerPhone}</div>
            </div>
          </div>
          <div class="detail-row">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/></svg>
            <div>
              <div class="detail-label">Ürün</div>
              <div class="detail-value">${order.productName}</div>
            </div>
          </div>
          <div class="detail-row">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
            <div>
              <div class="detail-label">Adres</div>
              <div class="detail-value">${order.address}</div>
            </div>
          </div>
        </div>
        <div class="order-actions">
          <button class="btn-take" onclick="takeOrder('${order.id}')">📦 Siparişi Al</button>
        </div>
      </div>
    `;
  });
  
  container.innerHTML = html;
}

// Take Order
window.takeOrder = async (orderId) => {
  if (!confirm('Bu siparişi almak istediğinize emin misiniz?')) return;
  
  try {
    const orderRef = ref(database, `orders/${orderId}`);
    const snapshot = await get(orderRef);
    
    if (!snapshot.exists()) {
      alert('Sipariş bulunamadı!');
      return;
    }
    
    const order = snapshot.val();
    const history = order.history || [];
    
    history.push({
      status: 'Kurye Tarafından Alındı',
      timestamp: new Date().toISOString(),
      note: `Kurye: ${currentUser.email}`
    });
    
    await update(orderRef, {
      status: 'shipped',
      courier: {
        email: currentUser.email,
        name: currentUser.displayName || currentUser.email,
        assignedAt: new Date().toISOString()
      },
      updatedAt: new Date().toISOString(),
      history
    });
    
    // Add to courier's active orders
    const courierKey = currentUser.email.replace(/[.@]/g, '_');
    const courierOrderRef = ref(database, `couriers/${courierKey}/activeOrders/${orderId}`);
    await set(courierOrderRef, {
      trackingCode: orderId,
      assignedAt: new Date().toISOString()
    });
    
    alert('Sipariş başarıyla alındı! Konum paylaşımını açmayı unutmayın.');
  } catch (error) {
    console.error('Take order error:', error);
    alert('Hata: ' + error.message);
  }
};

// Load My Orders
function loadMyOrders() {
  if (!currentUser) return;
  
  const ordersRef = ref(database, 'orders');
  onValue(ordersRef, (snapshot) => {
    const orders = snapshot.val() || {};
    const myOrders = Object.entries(orders)
      .filter(([_, order]) => order.courier && order.courier.email === currentUser.email && order.status === 'shipped')
      .map(([id, order]) => ({ id, ...order }));
    
    renderMyOrders(myOrders);
  });
}

function renderMyOrders(orders) {
  const container = document.getElementById('myOrdersContainer');
  
  if (orders.length === 0) {
    container.innerHTML = `
      <div class="empty-state">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
        <p>Aktif teslimatınız yok</p>
      </div>
    `;
    return;
  }
  
  let html = '';
  orders.forEach(order => {
    html += `
      <div class="order-card" style="border-color:var(--warning);">
        <div class="order-header">
          <div class="tracking-code">${order.id}</div>
          <span class="badge" style="background:rgba(245,158,11,0.2);color:var(--warning);">🚚 Yolda</span>
        </div>
        <div class="order-details">
          <div class="detail-row">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
            <div>
              <div class="detail-value">${order.customerName}</div>
              <div style="font-size:0.85rem;color:var(--text-muted);">${order.customerPhone}</div>
            </div>
          </div>
          <div class="detail-row">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/></svg>
            <div>
              <div class="detail-value">${order.address}</div>
            </div>
          </div>
        </div>
        <div class="order-actions">
          <button class="btn-take" style="background:linear-gradient(135deg,var(--success),#16a34a);" onclick="completeOrder('${order.id}')">✓ Teslim Edildi</button>
        </div>
      </div>
    `;
  });
  
  container.innerHTML = html;
}

// Complete Order
window.completeOrder = async (orderId) => {
  if (!confirm('Siparişi teslim edildi olarak işaretlemek istediğinize emin misiniz?')) return;
  
  try {
    const orderRef = ref(database, `orders/${orderId}`);
    const snapshot = await get(orderRef);
    
    if (!snapshot.exists()) {
      alert('Sipariş bulunamadı!');
      return;
    }
    
    const order = snapshot.val();
    const history = order.history || [];
    
    history.push({
      status: 'Teslim Edildi',
      timestamp: new Date().toISOString(),
      note: 'Müşteriye teslim edildi.'
    });
    
    await update(orderRef, {
      status: 'delivered',
      deliveredAt: new Date().toISOString(),
      updatedAt: new Date().toISOString(),
      history
    });
    
    // Remove from active orders
    const courierKey = currentUser.email.replace(/[.@]/g, '_');
    const courierOrderRef = ref(database, `couriers/${courierKey}/activeOrders/${orderId}`);
    await set(courierOrderRef, null);
    
    alert('Sipariş teslim edildi olarak işaretlendi!');
  } catch (error) {
    console.error('Complete order error:', error);
    alert('Hata: ' + error.message);
  }
};

// Delivery Button - Location Tracking
const btn = document.getElementById('deliveryBtn');
const progress = btn.querySelector('.progress');
const btnText = btn.querySelector('.text');
let holdTimer = null;
let holdProgress = 0;

btn.addEventListener('mousedown', startHold);
btn.addEventListener('touchstart', startHold);
btn.addEventListener('mouseup', stopHold);
btn.addEventListener('mouseleave', stopHold);
btn.addEventListener('touchend', stopHold);

function startHold(e) {
  e.preventDefault();
  
  if (isTracking) {
    stopTracking();
    return;
  }
  
  holdProgress = 0;
  holdTimer = setInterval(() => {
    holdProgress += 2;
    progress.style.width = holdProgress + '%';
    
    if (holdProgress >= 100) {
      clearInterval(holdTimer);
      startTracking();
    }
  }, 20);
}

function stopHold() {
  if (holdTimer) {
    clearInterval(holdTimer);
    holdTimer = null;
  }
  
  if (!isTracking) {
    progress.style.width = '0%';
  }
}

async function startTracking() {
  isTracking = true;
  btn.classList.add('tracking');
  btnText.textContent = 'Konum Paylaşılıyor (Durdurmak için bas)';
  progress.style.width = '100%';
  
  document.getElementById('locationStatus').classList.add('active');
  document.getElementById('locationDot').classList.add('active');
  document.getElementById('locationText').textContent = 'Konum Aktif - Müşteriler konumunuzu görebilir';
  
  // Request wake lock
  try {
    if ('wakeLock' in navigator) {
      wakeLock = await navigator.wakeLock.request('screen');
    }
  } catch (err) {
    console.warn('Wake lock failed:', err);
  }
  
  // Start location tracking
  const options = {
    enableHighAccuracy: true,
    maximumAge: 0,
    timeout: 15000
  };
  
  navigator.geolocation.getCurrentPosition(
    (pos) => updateLocation(pos),
    (err) => console.error('Location error:', err),
    options
  );
  
  watchId = navigator.geolocation.watchPosition(
    (pos) => updateLocation(pos),
    (err) => console.error('Location error:', err),
    options
  );
}

function stopTracking() {
  isTracking = false;
  btn.classList.remove('tracking');
  btnText.textContent = 'Yola Çıkıyorum (Basılı Tut)';
  progress.style.width = '0%';
  
  document.getElementById('locationStatus').classList.remove('active');
  document.getElementById('locationDot').classList.remove('active');
  document.getElementById('locationText').textContent = 'Konum Paylaşımı Kapalı';
  
  if (watchId) {
    navigator.geolocation.clearWatch(watchId);
    watchId = null;
  }
  
  if (wakeLock) {
    wakeLock.release();
    wakeLock = null;
  }
}

function updateLocation(position) {
  const locationData = {
    latitude: position.coords.latitude,
    longitude: position.coords.longitude,
    accuracy: position.coords.accuracy,
    speed: position.coords.speed || 0,
    heading: position.coords.heading || 0,
    timestamp: new Date().toISOString(),
    lastUpdate: Date.now()
  };
  
  const emailKey = currentUser.email.replace(/[.@]/g, '_');
  const locationRef = ref(database, `locations/${emailKey}`);
  
  set(locationRef, locationData).then(() => {
    console.log('Location updated');
  }).catch((error) => {
    console.error('Location update error:', error);
  });
}
</script>
