<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kurye Paneli | İmza İstanbul</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

:root {
  --primary: #4f46e5;
  --secondary: #7c3aed;
  --success: #22c55e;
  --danger: #f43f5e;
  --warning: #f59e0b;
  --bg: #0a0e1a;
  --surface: rgba(255,255,255,0.06);
  --border: rgba(255,255,255,0.1);
  --text: #f8fafc;
  --text-muted: #94a3b8;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Inter', -apple-system, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
}

body::before {
  content: '';
  position: fixed;
  inset: 0;
  background: 
    radial-gradient(circle at 20% 20%, rgba(79,70,229,0.15), transparent 50%),
    radial-gradient(circle at 80% 80%, rgba(124,58,237,0.15), transparent 50%);
  pointer-events: none;
  z-index: 0;
}

.container {
  max-width: 1200px;
  margin: 0 auto;
  padding: 20px;
  position: relative;
  z-index: 1;
}

/* Login */
#loginScreen {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
}

.login-card {
  background: var(--surface);
  backdrop-filter: blur(20px);
  border: 1px solid var(--border);
  border-radius: 24px;
  padding: 48px;
  width: 100%;
  max-width: 440px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.4);
}

.brand-icon {
  width: 80px;
  height: 80px;
  background: linear-gradient(135deg, var(--primary), var(--secondary));
  border-radius: 20px;
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 0 auto 24px;
}

.brand-icon svg {
  width: 40px;
  height: 40px;
  color: white;
}

.login-card h1 {
  font-size: 2rem;
  text-align: center;
  margin-bottom: 8px;
  background: linear-gradient(135deg, var(--primary), var(--secondary));
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}

.login-card p {
  text-align: center;
  color: var(--text-muted);
  margin-bottom: 32px;
}

.form-group {
  margin-bottom: 20px;
}

.form-group label {
  display: block;
  margin-bottom: 8px;
  font-weight: 600;
  font-size: 0.9rem;
  color: var(--text-muted);
}

.form-group input {
  width: 100%;
  padding: 14px 16px;
  background: rgba(255,255,255,0.05);
  border: 1px solid var(--border);
  border-radius: 12px;
  color: var(--text);
  font-size: 1rem;
  transition: all 0.3s;
}

.form-group input:focus {
  outline: none;
  border-color: var(--primary);
  background: rgba(255,255,255,0.08);
  box-shadow: 0 0 0 4px rgba(79,70,229,0.1);
}

.btn {
  padding: 14px 24px;
  border: none;
  border-radius: 12px;
  font-size: 1rem;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.3s;
}

.btn-primary {
  background: linear-gradient(135deg, var(--primary), var(--secondary));
  color: white;
  width: 100%;
  box-shadow: 0 8px 24px rgba(79,70,229,0.3);
}

.btn-primary:hover {
  transform: translateY(-2px);
  box-shadow: 0 12px 32px rgba(79,70,229,0.4);
}

/* Dashboard */
#dashboard {
  display: none;
}

#dashboard.active {
  display: block;
}

.header {
  background: var(--surface);
  backdrop-filter: blur(20px);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 24px;
  margin-bottom: 24px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 16px;
}

.header h1 {
  font-size: 1.8rem;
  margin-bottom: 4px;
}

.header-info {
  color: var(--text-muted);
  font-size: 0.9rem;
}

.btn-logout {
  background: transparent;
  border: 1px solid var(--border);
  color: var(--text);
  padding: 10px 20px;
  border-radius: 10px;
  cursor: pointer;
  transition: all 0.3s;
}

.btn-logout:hover {
  background: var(--danger);
  border-color: var(--danger);
  color: white;
}

/* Location Status */
.location-card {
  background: var(--surface);
  border: 2px solid var(--border);
  border-radius: 16px;
  padding: 20px 24px;
  margin-bottom: 24px;
  transition: all 0.3s;
}

.location-card.active {
  border-color: var(--success);
  background: rgba(34,197,94,0.1);
  box-shadow: 0 8px 32px rgba(34,197,94,0.2);
}

.location-status {
  display: flex;
  align-items: center;
  gap: 16px;
  margin-bottom: 16px;
}

.status-dot {
  width: 16px;
  height: 16px;
  border-radius: 50%;
  background: var(--text-muted);
  transition: all 0.3s;
}

.status-dot.active {
  background: var(--success);
  animation: pulse-dot 2s ease-in-out infinite;
}

@keyframes pulse-dot {
  0%, 100% {
    box-shadow: 0 0 0 0 rgba(34,197,94,0.7);
    transform: scale(1);
  }
  50% {
    box-shadow: 0 0 0 12px rgba(34,197,94,0);
    transform: scale(1.1);
  }
}

.location-status span {
  font-size: 1.05rem;
  font-weight: 600;
}

/* Delivery Button */
.delivery-btn {
  position: relative;
  width: 100%;
  padding: 20px;
  background: linear-gradient(135deg, var(--success), #16a34a);
  border: none;
  border-radius: 16px;
  color: white;
  font-size: 1.1rem;
  font-weight: 700;
  cursor: pointer;
  overflow: hidden;
  box-shadow: 0 12px 40px rgba(34,197,94,0.4);
  transition: all 0.3s;
  user-select: none;
}

.delivery-btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 16px 48px rgba(34,197,94,0.5);
}

.delivery-btn.tracking {
  background: linear-gradient(135deg, var(--danger), #dc2626);
  box-shadow: 0 12px 40px rgba(239,68,68,0.4);
}

.delivery-btn .progress {
  position: absolute;
  top: 0;
  left: 0;
  height: 100%;
  background: rgba(255,255,255,0.25);
  width: 0%;
  transition: width 20ms linear;
  border-radius: 16px;
}

.delivery-btn .text {
  position: relative;
  z-index: 2;
}

/* Section */
.section-title {
  font-size: 1.5rem;
  margin: 40px 0 20px;
  font-weight: 700;
}

.orders-grid {
  display: grid;
  gap: 16px;
}

.order-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 24px;
  transition: all 0.3s;
}

.order-card:hover {
  border-color: var(--primary);
  transform: translateY(-2px);
  box-shadow: 0 8px 32px rgba(79,70,229,0.2);
}

.order-card.ready {
  border-color: var(--success);
  background: rgba(34,197,94,0.05);
}

.order-header {
  display: flex;
  justify-content: space-between;
  align-items: start;
  margin-bottom: 16px;
  gap: 16px;
}

.tracking-code {
  font-size: 1.3rem;
  font-weight: 700;
  color: var(--primary);
}

.badge {
  padding: 6px 14px;
  border-radius: 999px;
  font-size: 0.85rem;
  font-weight: 600;
}

.badge-ready {
  background: rgba(34,197,94,0.2);
  color: var(--success);
}

.badge-shipped {
  background: rgba(245,158,11,0.2);
  color: var(--warning);
}

.order-info {
  display: grid;
  gap: 12px;
  margin-bottom: 16px;
}

.info-row {
  display: grid;
  grid-template-columns: 100px 1fr;
  gap: 12px;
}

.info-label {
  font-size: 0.9rem;
  color: var(--text-muted);
  font-weight: 500;
}

.info-value {
  font-size: 0.95rem;
  font-weight: 500;
}

.order-actions {
  display: flex;
  gap: 12px;
  margin-top: 20px;
}

.btn-action {
  flex: 1;
  padding: 12px;
  border: none;
  border-radius: 12px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.3s;
}

.btn-take {
  background: linear-gradient(135deg, var(--success), #16a34a);
  color: white;
}

.btn-take:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 24px rgba(34,197,94,0.4);
}

.btn-complete {
  background: linear-gradient(135deg, var(--primary), var(--secondary));
  color: white;
}

.btn-complete:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 24px rgba(79,70,229,0.4);
}

.loading {
  display: inline-block;
  width: 20px;
  height: 20px;
  border: 3px solid rgba(255,255,255,0.3);
  border-radius: 50%;
  border-top-color: white;
  animation: spin 0.6s linear infinite;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

.empty-state {
  text-align: center;
  padding: 60px 20px;
  color: var(--text-muted);
}

.alert {
  padding: 12px 16px;
  border-radius: 12px;
  margin-top: 16px;
  font-size: 0.9rem;
}

.alert-error {
  background: rgba(244,63,94,0.1);
  border: 1px solid rgba(244,63,94,0.3);
  color: var(--danger);
}

@media (max-width: 768px) {
  .login-card { padding: 32px; }
  .header { flex-direction: column; align-items: flex-start; }
  .header h1 { font-size: 1.4rem; }
  .order-actions { flex-direction: column; }
}
</style>
</head>
<body>

<!-- Login -->
<div id="loginScreen">
  <div class="login-card">
    <div class="brand-icon">
      <svg fill="currentColor" viewBox="0 0 24 24"><path d="M13 2 3 14h7l-1 8 11-14h-7l0-6Z"/></svg>
    </div>
    <h1>Kurye Paneli</h1>
    <p>İmza İstanbul Teslimat Sistemi</p>
    
    <form id="loginForm">
      <div class="form-group">
        <label>E-posta</label>
        <input type="email" id="loginEmail" required placeholder="kurye@zirveeimza.com">
      </div>
      
      <div class="form-group">
        <label>Şifre</label>
        <input type="password" id="loginPassword" required placeholder="••••••••">
      </div>
      
      <button type="submit" class="btn btn-primary">
        <span id="loginBtnText">Giriş Yap</span>
      </button>
      
      <div id="loginMessage"></div>
    </form>
  </div>
</div>

<!-- Dashboard -->
<div id="dashboard">
  <div class="container">
    <div class="header">
      <div>
        <h1>Kurye Paneli</h1>
        <div class="header-info" id="userEmail"></div>
      </div>
      <button class="btn-logout" onclick="logout()">Çıkış</button>
    </div>

    <div id="locationCard" class="location-card">
      <div class="location-status">
        <div id="statusDot" class="status-dot"></div>
        <span id="statusText">Konum Paylaşımı Kapalı</span>
      </div>
      
      <button id="deliveryBtn" class="delivery-btn">
        <div class="progress"></div>
        <div class="text">Yola Çıkıyorum (Basılı Tut)</div>
      </button>
    </div>

    <h2 class="section-title">Teslimata Hazır Siparişler</h2>
    <div id="readyOrders" class="orders-grid"></div>

    <h2 class="section-title" style="margin-top:48px;">Aktif Teslimatlarım <span id="activeCount" style="font-size:1rem;font-weight:600;color:var(--success);margin-left:12px;"></span></h2>
    <div id="myOrders" class="orders-grid"></div>
  </div>
</div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';
import { getDatabase, ref, get, set, onValue, update } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js';

const firebaseConfig = {
  apiKey: "AIzaSyADykV8-GjNNoK30CUkPlqCNMjR7Ggc1M8",
  authDomain: "e-imza-4c867.firebaseapp.com",
  databaseURL: "https://e-imza-4c867-default-rtdb.firebaseio.com",
  projectId: "e-imza-4c867",
  storageBucket: "e-imza-4c867.firebasestorage.app",
  messagingSenderId: "856535109805",
  appId: "1:856535109805:web:39f6fa2e23275f7be77624"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const database = getDatabase(app);

let currentUser = null;
let isTracking = false;
let watchId = null;
let wakeLock = null;

// Auth
onAuthStateChanged(auth, (user) => {
  if (user) {
    currentUser = user;
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('dashboard').classList.add('active');
    document.getElementById('userEmail').textContent = user.email;
    loadReadyOrders();
    loadMyOrders();
  } else {
    document.getElementById('loginScreen').style.display = 'flex';
  }
});

// Login
document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const email = document.getElementById('loginEmail').value;
  const password = document.getElementById('loginPassword').value;
  const btnText = document.getElementById('loginBtnText');
  const msg = document.getElementById('loginMessage');
  
  btnText.innerHTML = '<div class="loading"></div>';
  
  try {
    await signInWithEmailAndPassword(auth, email, password);
  } catch (error) {
    msg.innerHTML = `<div class="alert alert-error">Giriş başarısız: ${error.message}</div>`;
    btnText.textContent = 'Giriş Yap';
  }
});

window.logout = async () => {
  if (confirm('Çıkış yapmak istediğiniz emin misiniz?')) {
    if (isTracking) stopTracking();
    await signOut(auth);
  }
};

// Load Ready Orders
function loadReadyOrders() {
  const ordersRef = ref(database, 'orders');
  onValue(ordersRef, (snapshot) => {
    const orders = snapshot.val() || {};
    const readyOrders = Object.entries(orders)
      .filter(([_, order]) => order.status === 'ready')
      .map(([id, order]) => ({ id, ...order }));
    
    renderReadyOrders(readyOrders);
  });
}

function renderReadyOrders(orders) {
  const container = document.getElementById('readyOrders');
  
  if (orders.length === 0) {
    container.innerHTML = '<div class="empty-state">Şu anda teslimata hazır sipariş yok</div>';
    return;
  }
  
  let html = '';
  orders.forEach(order => {
    html += `
      <div class="order-card ready">
        <div class="order-header">
          <div class="tracking-code">${order.id}</div>
          <span class="badge badge-ready">Hazır</span>
        </div>
        <div class="order-info">
          <div class="info-row">
            <div class="info-label">Müşteri:</div>
            <div class="info-value">${order.customerName}</div>
          </div>
          <div class="info-row">
            <div class="info-label">Telefon:</div>
            <div class="info-value">${order.customerPhone}</div>
          </div>
          <div class="info-row">
            <div class="info-label">Ürün:</div>
            <div class="info-value">${order.productName}</div>
          </div>
          <div class="info-row">
            <div class="info-label">Adres:</div>
            <div class="info-value">${order.address}</div>
          </div>
        </div>
        <div class="order-actions">
          <button class="btn-action btn-take" onclick="takeOrder('${order.id}')">Siparişi Al</button>
        </div>
      </div>
    `;
  });
  
  container.innerHTML = html;
}

// Take Order
window.takeOrder = async (orderId) => {
  if (!confirm('Bu siparişi almak istediğinize emin misiniz?')) return;
  
  try {
    const orderRef = ref(database, `orders/${orderId}`);
    const snapshot = await get(orderRef);
    
    if (!snapshot.exists()) {
      alert('Sipariş bulunamadı!');
      return;
    }
    
    const order = snapshot.val();
    const history = order.history || [];
    
    history.push({
      status: 'Kurye Tarafından Alındı',
      timestamp: new Date().toISOString(),
      note: `Kurye: ${currentUser.email}`
    });
    
    await update(orderRef, {
      status: 'shipped',
      courier: {
        email: currentUser.email,
        name: currentUser.displayName || currentUser.email,
        assignedAt: new Date().toISOString()
      },
      updatedAt: new Date().toISOString(),
      history
    });
    
    const courierKey = currentUser.email.replace(/[.@]/g, '_');
    const courierOrderRef = ref(database, `couriers/${courierKey}/activeOrders/${orderId}`);
    await set(courierOrderRef, {
      trackingCode: orderId,
      assignedAt: new Date().toISOString()
    });
    
    alert('Sipariş başarıyla alındı! Konum paylaşımını açmayı unutmayın.');
  } catch (error) {
    console.error('Take order error:', error);
    alert('Hata: ' + error.message);
  }
};

// Load My Orders
function loadMyOrders() {
  if (!currentUser) return;
  
  const ordersRef = ref(database, 'orders');
  onValue(ordersRef, (snapshot) => {
    const orders = snapshot.val() || {};
    const myOrders = Object.entries(orders)
      .filter(([_, order]) => order.courier && order.courier.email === currentUser.email && order.status === 'shipped')
      .map(([id, order]) => ({ id, ...order }));
    
    renderMyOrders(myOrders);
  });
}

function renderMyOrders(orders) {
  const container = document.getElementById('myOrders');
  const countBadge = document.getElementById('activeCount');
  
  if (orders.length === 0) {
    container.innerHTML = '<div class="empty-state">Aktif teslimatınız yok</div>';
    countBadge.textContent = '';
    return;
  }
  
  countBadge.textContent = `(${orders.length})`;
  
  let html = '';
  orders.forEach(order => {
    html += `
      <div class="order-card">
        <div class="order-header">
          <div class="tracking-code">${order.id}</div>
          <span class="badge badge-shipped">Yolda</span>
        </div>
        <div class="order-info">
          <div class="info-row">
            <div class="info-label">Müşteri:</div>
            <div class="info-value">${order.customerName}</div>
          </div>
          <div class="info-row">
            <div class="info-label">Telefon:</div>
            <div class="info-value">${order.customerPhone}</div>
          </div>
          <div class="info-row">
            <div class="info-label">Adres:</div>
            <div class="info-value">${order.address}</div>
          </div>
        </div>
        <div class="order-actions">
          <button class="btn-action btn-complete" onclick="completeOrder('${order.id}')">Teslim Edildi</button>
        </div>
      </div>
    `;
  });
  
  container.innerHTML = html;
}

// Complete Order
window.completeOrder = async (orderId) => {
  if (!confirm('Siparişi teslim edildi olarak işaretlemek istediğinize emin misiniz?')) return;
  
  try {
    const orderRef = ref(database, `orders/${orderId}`);
    const snapshot = await get(orderRef);
    
    if (!snapshot.exists()) {
      alert('Sipariş bulunamadı!');
      return;
    }
    
    const order = snapshot.val();
    const history = order.history || [];
    
    history.push({
      status: 'Teslim Edildi',
      timestamp: new Date().toISOString(),
      note: 'Müşteriye teslim edildi.'
    });
    
    await update(orderRef, {
      status: 'delivered',
      deliveredAt: new Date().toISOString(),
      updatedAt: new Date().toISOString(),
      history
    });
    
    const courierKey = currentUser.email.replace(/[.@]/g, '_');
    const courierOrderRef = ref(database, `couriers/${courierKey}/activeOrders/${orderId}`);
    await set(courierOrderRef, null);
    
    alert('Sipariş teslim edildi olarak işaretlendi!');
  } catch (error) {
    console.error('Complete order error:', error);
    alert('Hata: ' + error.message);
  }
};

// Delivery Button
const btn = document.getElementById('deliveryBtn');
const progress = btn.querySelector('.progress');
const btnText = btn.querySelector('.text');
let holdTimer = null;
let holdProgress = 0;

btn.addEventListener('mousedown', startHold);
btn.addEventListener('touchstart', startHold);
btn.addEventListener('mouseup', stopHold);
btn.addEventListener('mouseleave', stopHold);
btn.addEventListener('touchend', stopHold);

function startHold(e) {
  e.preventDefault();
  
  if (isTracking) {
    stopTracking();
    return;
  }
  
  holdProgress = 0;
  holdTimer = setInterval(() => {
    holdProgress += 2;
    progress.style.width = holdProgress + '%';
    
    if (holdProgress >= 100) {
      clearInterval(holdTimer);
      startTracking();
    }
  }, 20);
}

function stopHold() {
  if (holdTimer) {
    clearInterval(holdTimer);
    holdTimer = null;
  }
  
  if (!isTracking) {
    progress.style.width = '0%';
  }
}

async function startTracking() {
  isTracking = true;
  btn.classList.add('tracking');
  btnText.textContent = 'Konum Paylaşılıyor (Durdurmak için bas)';
  progress.style.width = '100%';
  
  document.getElementById('locationCard').classList.add('active');
  document.getElementById('statusDot').classList.add('active');
  document.getElementById('statusText').textContent = 'Konum Aktif - Müşteriler konumunuzu görebilir';
  
  try {
    if ('wakeLock' in navigator) {
      wakeLock = await navigator.wakeLock.request('screen');
    }
  } catch (err) {
    console.warn('Wake lock failed:', err);
  }
  
  const options = {
    enableHighAccuracy: true,
    maximumAge: 0,
    timeout: 15000
  };
  
  navigator.geolocation.getCurrentPosition(
    (pos) => updateLocation(pos),
    (err) => console.error('Location error:', err),
    options
  );
  
  watchId = navigator.geolocation.watchPosition(
    (pos) => updateLocation(pos),
    (err) => console.error('Location error:', err),
    options
  );
}

function stopTracking() {
  isTracking = false;
  btn.classList.remove('tracking');
  btnText.textContent = 'Yola Çıkıyorum (Basılı Tut)';
  progress.style.width = '0%';
  
  document.getElementById('locationCard').classList.remove('active');
  document.getElementById('statusDot').classList.remove('active');
  document.getElementById('statusText').textContent = 'Konum Paylaşımı Kapalı';
  
  if (watchId) {
    navigator.geolocation.clearWatch(watchId);
    watchId = null;
  }
  
  if (wakeLock) {
    wakeLock.release();
    wakeLock = null;
  }
}

function updateLocation(position) {
  const locationData = {
    latitude: position.coords.latitude,
    longitude: position.coords.longitude,
    accuracy: position.coords.accuracy,
    speed: position.coords.speed || 0,
    heading: position.coords.heading || 0,
    timestamp: new Date().toISOString(),
    lastUpdate: Date.now()
  };
  
  const emailKey = currentUser.email.replace(/[.@]/g, '_');
  const locationRef = ref(database, `locations/${emailKey}`);
  
  set(locationRef, locationData).then(() => {
    console.log('Location updated');
  }).catch((error) => {
    console.error('Location update error:', error);
  });
}
</script>
</body>
