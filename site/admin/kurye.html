<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kurye Paneli | Zirve E-İmza</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%234f46e5'/%3E%3Cstop offset='1' stop-color='%237c3aed'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='24' height='24' rx='6' fill='url(%23g)'/%3E%3Cpath d='M5 16 c3-6 5 -2 7 -7 c1.5 3 2 5 3.5 2' stroke='white' stroke-width='2' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
:root {
  --primary: #4f46e5;
  --secondary: #7c3aed;
  --success: #22c55e;
  --warning: #f59e0b;
  --danger: #f43f5e;
  --bg: #0b0e1a;
  --surface: rgba(255,255,255,0.05);
  --border: rgba(255,255,255,0.12);
  --text: #f3f4f8;
  --text-muted: #7d81a0;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.6;
}

.header {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 16px 24px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  position: sticky;
  top: 0;
  z-index: 100;
  backdrop-filter: blur(10px);
  flex-wrap: wrap;
  gap: 12px;
}

.header h1 {
  font-size: 1.5rem;
  background: linear-gradient(135deg, var(--primary), var(--secondary));
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}

.container {
  max-width: 1200px;
  margin: 0 auto;
  padding: 20px;
}

.status-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 24px;
  margin-bottom: 24px;
  text-align: center;
}

.location-status {
  font-size: 1.2rem;
  font-weight: 600;
  margin-bottom: 16px;
}

.location-status.active {
  color: var(--success);
}

.location-status.inactive {
  color: var(--danger);
}

.btn {
  padding: 12px 24px;
  border: none;
  border-radius: 10px;
  font-size: 1rem;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.3s;
  display: inline-flex;
  align-items: center;
  gap: 8px;
}

.btn-primary {
  background: linear-gradient(135deg, var(--primary), var(--secondary));
  color: white;
}

.btn-success {
  background: var(--success);
  color: white;
}

.btn-danger {
  background: var(--danger);
  color: white;
}

.orders-list {
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.order-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 20px;
}

.order-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 12px;
}

.order-code {
  font-size: 1.1rem;
  font-weight: 700;
  color: var(--primary);
}

.order-info {
  font-size: 0.9rem;
  color: var(--text-muted);
  margin-bottom: 12px;
}

.order-actions {
  display: flex;
  gap: 8px;
  margin-top: 12px;
}

.alert {
  padding: 16px;
  border-radius: 12px;
  margin-bottom: 20px;
}

.alert-success {
  background: rgba(34,197,94,0.1);
  border: 1px solid rgba(34,197,94,0.3);
  color: var(--success);
}

.alert-error {
  background: rgba(244,63,94,0.1);
  border: 1px solid rgba(244,63,94,0.3);
  color: var(--danger);
}

.loading {
  display: inline-block;
  width: 20px;
  height: 20px;
  border: 3px solid rgba(255,255,255,0.1);
  border-radius: 50%;
  border-top-color: var(--primary);
  animation: spin 0.8s linear infinite;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}
</style>
</head>
<body>

<div class="header">
  <h1>🚚 Kurye Paneli</h1>
  <div>
    <span id="courierName" style="margin-right:12px;color:var(--text-muted);"></span>
    <button class="btn btn-danger" onclick="logout()">Çıkış</button>
  </div>
</div>

<div class="container">
  <div class="status-card">
    <div class="location-status" id="locationStatus">Konum Paylaşımı Kapalı</div>
    <p style="color:var(--text-muted);margin-bottom:16px;">Müşterilere anlık konumunuzu göstermek için konum paylaşımını açın.</p>
    <button class="btn btn-success" id="toggleLocationBtn" onclick="toggleLocationSharing()">
      📍 Konum Paylaşımını Başlat
    </button>
    <div id="locationMessage"></div>
  </div>

  <div id="ordersSection">
    <h2 style="margin-bottom:16px;">Aktif Teslimatlar</h2>
    <div id="ordersContainer">
      <div style="text-align:center;padding:40px;color:var(--text-muted);">
        <div class="loading"></div>
        <p style="margin-top:16px;">Siparişler yükleniyor...</p>
      </div>
    </div>
  </div>
</div>

<script type="module" src="kurye.js"></script>
</body>
</html>
