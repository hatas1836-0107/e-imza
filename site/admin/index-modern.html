<style>
/* ZIRVE E-İMZA ADMIN PANEL - MODERN & FULL-FEATURED */
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

:root {
  --primary: #4f46e5;
  --secondary: #7c3aed;
  --success: #22c55e;
  --danger: #f43f5e;
  --warning: #f59e0b;
  --info: #3b82f6;
  
  --bg: #0b0e1a;
  --surface: rgba(255,255,255,0.055);
  --surface-hover: rgba(255,255,255,0.08);
  --border: rgba(255,255,255,0.12);
  --text: #f3f4f8;
  --text-muted: #7d81a0;
  
  --gradient-brand: linear-gradient(135deg, #4f46e5 0%, #7c3aed 55%, #a855f7 100%);
  --gradient-mesh:
    radial-gradient(circle at 12% 18%, rgba(79,70,229,0.35), transparent 40%),
    radial-gradient(circle at 85% 12%, rgba(124,58,237,0.30), transparent 45%),
    radial-gradient(circle at 70% 80%, rgba(232,163,61,0.16), transparent 45%),
    radial-gradient(circle at 15% 85%, rgba(99,102,241,0.22), transparent 40%);
    
  --shadow: 0 8px 32px rgba(0,0,0,0.35);
  --radius: 12px;
  --radius-lg: 16px;
  --radius-sm: 8px;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Inter', -apple-system, sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.6;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}

.mesh-bg {
  position: fixed;
  inset: 0;
  background: var(--gradient-mesh);
  z-index: 0;
  pointer-events: none;
}

.grain-overlay {
  position: fixed;
  inset: 0;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='4' numOctaves='4' /%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.08'/%3E%3C/svg%3E");
  opacity: 0.5;
  z-index: 1;
  pointer-events: none;
}

.container {
  max-width: 1400px;
  margin: 0 auto;
  padding: 0 20px;
  position: relative;
  z-index: 2;
}

.header {
  position: sticky;
  top: 0;
  z-index: 100;
  background: rgba(11,14,26,0.7);
  backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border);
  padding: 16px 0;
}

.header-content {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 20px;
  flex-wrap: wrap;
}

.brand {
  display: flex;
  align-items: center;
  gap: 12px;
  font-size: 1.25rem;
  font-weight: 700;
  background: var(--gradient-brand);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}

.brand-icon {
  width: 36px;
  height: 36px;
  background: var(--gradient-brand);
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.user-info {
  display: flex;
  align-items: center;
  gap: 16px;
}

.user-email {
  font-size: 0.9rem;
  color: var(--text-muted);
}

.btn {
  padding: 10px 20px;
  border: none;
  border-radius: var(--radius);
  font-size: 0.9rem;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.3s;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  white-space: nowrap;
}

.btn-primary {
  background: var(--gradient-brand);
  color: white;
}

.btn-primary:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 24px rgba(79,70,229,0.4);
}

.btn-danger {
  background: var(--danger);
  color: white;
}

.btn-danger:hover {
  background: #dc2626;
}

.btn-secondary {
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--text);
}

.btn-secondary:hover {
  background: var(--surface-hover);
}

.btn-sm {
  padding: 8px 16px;
  font-size: 0.85rem;
}

.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
  gap: 20px;
  margin: 24px 0;
}

.stat-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 24px;
  transition: transform 0.3s;
}

.stat-card:hover {
  transform: translateY(-4px);
}

.stat-icon {
  width: 20px;
  height: 20px;
  margin-right: 8px;
}

.stat-label {
  font-size: 0.85rem;
  color: var(--text-muted);
  margin-bottom: 8px;
  font-weight: 500;
  display: flex;
  align-items: center;
}

.stat-value {
  font-size: 2rem;
  font-weight: 800;
  background: var(--gradient-brand);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}

.tabs {
  display: flex;
  gap: 8px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 6px;
  margin: 24px 0;
  overflow-x: auto;
}

.tabs::-webkit-scrollbar {
  display: none;
}

.tab-btn {
  flex: 1;
  min-width: 120px;
  padding: 12px 20px;
  border: none;
  background: transparent;
  color: var(--text-muted);
  border-radius: 8px;
  font-size: 0.9rem;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.3s;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}

.tab-btn svg {
  width: 18px;
  height: 18px;
}

.tab-btn:hover {
  background: var(--surface-hover);
  color: var(--text);
}

.tab-btn.active {
  background: var(--gradient-brand);
  color: white;
}

.section {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 24px;
  margin-bottom: 24px;
}

.section-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 24px;
  gap: 16px;
  flex-wrap: wrap;
}

.section-title {
  font-size: 1.5rem;
  font-weight: 700;
  display: flex;
  align-items: center;
  gap: 10px;
}

.section-title svg {
  width: 24px;
  height: 24px;
}

.products-grid {
  display: grid;
  gap: 20px;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
}

.product-card {
  background: rgba(255,255,255,0.03);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  transition: all 0.3s;
}

.product-card:hover {
  transform: translateY(-2px);
  border-color: var(--primary);
  box-shadow: 0 8px 24px rgba(79,70,229,0.2);
}

.product-image {
  width: 100%;
  height: 160px;
  background: linear-gradient(135deg, rgba(79,70,229,0.1), rgba(168,85,247,0.1));
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 3rem;
}

.product-image img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.product-body {
  padding: 16px;
}

.product-name {
  font-size: 1.1rem;
  font-weight: 700;
  margin-bottom: 8px;
}

.product-price {
  font-size: 1.4rem;
  font-weight: 800;
  color: var(--primary);
  margin-bottom: 12px;
}

.product-badges {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  margin-bottom: 12px;
}

.badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 4px 10px;
  border-radius: 999px;
  font-size: 0.75rem;
  font-weight: 600;

.badge-success {
  background: rgba(34,197,94,0.2);
  color: var(--success);
}

.badge-warning {
  background: rgba(245,158,11,0.2);
  color: var(--warning);
}

.badge-info {
  background: rgba(59,130,246,0.2);
  color: var(--info);
}

.badge-danger {
  background: rgba(244,63,94,0.2);
  color: var(--danger);
}

.product-description {
  font-size: 0.85rem;
  color: var(--text-muted);
  margin-bottom: 12px;
  line-height: 1.5;
}

.product-features {
  list-style: none;
  margin: 12px 0;
  font-size: 0.85rem;
}

.product-features li {
  display: flex;
  align-items: start;
  gap: 8px;
  margin-bottom: 6px;
  color: var(--text-muted);
}

.product-features li::before {
  content: '✓';
  color: var(--success);
  font-weight: bold;
}

.product-actions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  padding: 12px;
  border-top: 1px solid var(--border);
}

.product-actions .btn {
  width: 100%;
  justify-content: center;
  font-size: 0.85rem;
}

.loading {
  display: inline-block;
  width: 20px;
  height: 20px;
  border: 3px solid rgba(255,255,255,0.3);
  border-radius: 50%;
  border-top-color: white;
  animation: spin 0.6s linear infinite;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.5; }
}

.modal {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.7);
  backdrop-filter: blur(4px);
  z-index: 1000;
  align-items: center;
  justify-content: center;
  padding: 20px;
  overflow-y: auto;
}

.modal.active {
  display: flex;
}

.modal-content {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 30px;
  width: 100%;
  max-width: 600px;
  max-height: 90vh;
  overflow-y: auto;
  position: relative;
  z-index: 1001;
}

.modal-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 24px;
}

.modal-header h3 {
  font-size: 1.5rem;
}

.close-btn {
  background: none;
  border: none;
  color: var(--text-muted);
  font-size: 1.5rem;
  cursor: pointer;
  padding: 0;
  width: 32px;
  height: 32px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 8px;
  transition: all 0.3s;
}

.close-btn:hover {
  background: var(--surface);
  color: var(--text);
}

.alert {
  padding: 12px 16px;
  border-radius: var(--radius);
  margin-bottom: 20px;
  font-size: 0.9rem;
}

.alert-success {
  background: rgba(34,197,94,0.1);
  border: 1px solid rgba(34,197,94,0.3);
  color: var(--success);
}

.alert-error {
  background: rgba(244,63,94,0.1);
  border: 1px solid rgba(244,63,94,0.3);
  color: var(--danger);
}

.start-delivery-btn {
  position: relative;
  width: 100%;
  padding: 16px;
  background: var(--gradient-brand);
  border: none;
  border-radius: var(--radius);
  overflow: hidden;
  cursor: pointer;
  user-select: none;
}

.start-delivery-btn .progress {
  position: absolute;
  top: 0;
  left: 0;
  height: 100%;
  background: rgba(255,255,255,0.2);
  width: 0%;
  transition: width 20ms linear;
}

.start-delivery-btn .text {
  position: relative;
  z-index: 2;
  font-weight: 600;
  color: white;
}

.start-delivery-btn.tracking {
  background: var(--success);
}

@media (max-width: 768px) {
  .stats-grid { grid-template-columns: repeat(2, 1fr); }
  .products-grid { grid-template-columns: repeat(2, 1fr); }
  .section { padding: 16px; }
  .user-email { display: none; }
}

@media (max-width: 480px) {
  .stats-grid, .products-grid { grid-template-columns: 1fr; }
  .product-actions { grid-template-columns: 1fr; }
}

// Email normalization
function normalizeEmail(email) {
  if (!email) return '';
  const turkishMap = {
    'ı': 'i', 'İ': 'i', 'ğ': 'g', 'Ğ': 'g',
    'ü': 'u', 'Ü': 'u', 'ş': 's', 'Ş': 's',
    'ö': 'o', 'Ö': 'o', 'ç': 'c', 'Ç': 'c'
  };
  return email.toLowerCase().split('').map(char => turkishMap[char] || char).join('');
}

// Check if email is admin

  if (!email) return false;
  const normalized = normalizeEmail(email);
  console.log('🔍 Admin check:', email, '→', normalized);
  return ADMIN_EMAILS.some(admin => normalizeEmail(admin) === normalized);
}

onAuthStateChanged(auth, (user) => {
  if (user) {
    console.log('✅ User logged in:', user.email);
    
    // Admin kontrolü
    if (!isAdminEmail(user.email)) {
      console.error('❌ Not an admin:', user.email);
      alert('❌ Admin yetkisi yok! Lütfen yönetici hesabıyla giriş yapın.');
      signOut(auth);
      window.location.href = '../giris.html';
      return;
    }
    
    console.log('✅ Admin confirmed, loading dashboard...');
    currentUser = user;
    
    // Session flag'i temizle
    sessionStorage.removeItem('justLoggedIn');
    sessionStorage.removeItem('userRole');
    
    document.getElementById('userEmail').textContent = user.email;
    loadProducts();
    loadOrders();
    loadCouriers();
  } else {
    console.log('❌ No user, redirecting to login...');
    // Kullanıcı oturum açmamışsa giriş sayfasına yönlendir
    window.location.href = '../giris.html';
  }
});

// Logout
window.logout = async () => {
  if (confirm('Çıkış yapmak istediğinize emin misiniz?')) {
    await signOut(auth);
    window.location.href = '../giris.html';
  }
};

// Load products
function loadProducts() {
  const productsRef = ref(database, 'products');
  onValue(productsRef, (snapshot) => {
    products = snapshot.val() || {};
    renderProducts();
    updateStats();
  });
}

// Render products
function renderProducts() {
  const container = document.getElementById('productsContainer');
  if (Object.keys(products).length === 0) {
    container.innerHTML = '<div style="text-align:center;padding:40px;color:var(--text-muted);"><p>Henüz ürün eklenmemiş.</p><button class="btn btn-primary" onclick="alert(\'Ürün ekleme yakında!\')" style="margin-top:16px;">İlk Ürünü Ekle</button></div>';
    return;
  }
  
  const productsArray = Object.entries(products).map(([id, data]) => ({ id, ...data }));
  let html = '<div class="products-grid">';
  
  productsArray.forEach(product => {
    const statusBadge = product.status === 'active' ? '<span class="badge badge-success">Aktif</span>' : '<span class="badge badge-warning">Pasif</span>';
    const imageHTML = product.imageUrl ? `<img src="${product.imageUrl}" alt="${product.name}">` : '<div style="font-size:2rem;opacity:0.3;">IMG</div>';
    const featuresList = (product.features || []).slice(0, 3).map(f => `<li>${f}</li>`).join('');
    
    html += `
      <div class="product-card">
        <div class="product-image">${imageHTML}</div>
        <div class="product-body">
          <div class="product-name">${product.name}</div>
          <div class="product-price">${product.price}₺ <span style="font-size:0.7rem;color:var(--text-muted);">+KDV</span></div>
          <div class="product-badges">${statusBadge} <span class="badge badge-info">${product.duration}</span></div>
          ${product.description ? `<p style="font-size:0.85rem;color:var(--text-muted);margin:4px 0;">${product.description}</p>` : ''}
          ${featuresList ? `<ul class="product-features">${featuresList}</ul>` : ''}
        </div>
        <div class="product-actions">
          <button class="btn btn-secondary" onclick="alert('Düzenleme yakında!')">Düzenle</button>
          <button class="btn btn-danger" onclick="alert('Silme yakında!')">Sil</button>
        </div>
      </div>
    `;
  });
  
  html += '</div>';
  container.innerHTML = html;
}

// Update statistics
function updateStats() {
  const productsArray = Object.values(products);
  const total = productsArray.length;
  const active = productsArray.filter(p => p.status === 'active').length;
  const revenue = productsArray.reduce((sum, p) => sum + (parseFloat(p.price) || 0), 0);
  
  document.getElementById('totalProducts').textContent = total;
  document.getElementById('activeProducts').textContent = active;
  document.getElementById('totalRevenue').textContent = revenue.toLocaleString('tr-TR') + '₺';
  document.getElementById('lastUpdate').textContent = new Date().toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' });
}
