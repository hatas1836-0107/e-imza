<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel | İmza İstanbul</title>
<style>
:root {
  --primary: #4f46e5;
  --secondary: #7c3aed;
  --success: #22c55e;
  --danger: #f43f5e;
  --bg: #0b0e1a;
  --surface: rgba(255,255,255,0.05);
  --border: rgba(255,255,255,0.1);
  --text: #f3f4f8;
  --text-muted: #9ca3af;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.6;
}

.container {
  max-width: 1400px;
  margin: 0 auto;
  padding: 20px;
}

.header {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 24px;
  margin-bottom: 24px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 16px;
}

.header h1 {
  font-size: 2rem;
  background: linear-gradient(135deg, var(--primary), var(--secondary));
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}

.user-info {
  display: flex;
  align-items: center;
  gap: 12px;
}

.btn {
  padding: 10px 20px;
  border: none;
  border-radius: 8px;
  font-size: 0.9rem;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.3s;
}

.btn-primary {
  background: linear-gradient(135deg, var(--primary), var(--secondary));
  color: white;
}

.btn-danger {
  background: var(--danger);
  color: white;
}

.btn:hover {
  transform: translateY(-2px);
  opacity: 0.9;
}

.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
  gap: 20px;
  margin-bottom: 30px;
}

.stat-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 24px;
}

.stat-card h3 {
  color: var(--text-muted);
  font-size: 0.9rem;
  margin-bottom: 8px;
}

.stat-card .value {
  font-size: 2rem;
  font-weight: 700;
  background: linear-gradient(135deg, var(--primary), var(--secondary));
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}

.section {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 24px;
  margin-bottom: 24px;
}

.section-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 24px;
  flex-wrap: wrap;
  gap: 12px;
}

.products-grid {
  display: grid;
  gap: 20px;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
}

.product-card {
  background: rgba(255,255,255,0.03);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 20px;
  transition: all 0.3s;
}

.product-card:hover {
  transform: translateY(-2px);
  border-color: var(--primary);
}

.product-name {
  font-size: 1.2rem;
  font-weight: 700;
  margin-bottom: 8px;
}

.product-price {
  font-size: 1.5rem;
  font-weight: 700;
  color: var(--primary);
  margin-bottom: 12px;
}

.product-actions {
  display: flex;
  gap: 8px;
  margin-top: 16px;
}

.badge {
  display: inline-block;
  padding: 4px 12px;
  border-radius: 999px;
  font-size: 0.8rem;
  font-weight: 600;
}

.badge-success {
  background: rgba(34,197,94,0.2);
  color: var(--success);
}

.loading {
  display: inline-block;
  width: 20px;
  height: 20px;
  border: 3px solid rgba(255,255,255,0.3);
  border-radius: 50%;
  border-top-color: var(--primary);
  animation: spin 0.8s linear infinite;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

@media (max-width: 768px) {
  .header { padding: 16px; }
  .header h1 { font-size: 1.5rem; }
  .stats-grid { grid-template-columns: repeat(2, 1fr); }
  .products-grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<header class="header">
  <h1>İmza İstanbul Admin</h1>
  <div class="user-info">
    <span id="userEmail"></span>
    <button class="btn btn-danger" onclick="logout()">Çıkış</button>
  </div>
</header>

<div class="container">
  <!-- Stats -->
  <div class="stats-grid">
    <div class="stat-card">
      <h3>Toplam Ürün</h3>
      <div class="value" id="totalProducts">0</div>
    </div>
    <div class="stat-card">
      <h3>Aktif Ürünler</h3>
      <div class="value" id="activeProducts">0</div>
    </div>
    <div class="stat-card">
      <h3>Toplam Fiyat</h3>
      <div class="value" id="totalRevenue">0₺</div>
    </div>
    <div class="stat-card">
      <h3>Son Güncelleme</h3>
      <div class="value" style="font-size:1.2rem;" id="lastUpdate">-</div>
    </div>
  </div>

  <!-- Products Section -->
  <div class="section">
    <div class="section-header">
      <h2>Ürün Yönetimi</h2>
      <button class="btn btn-primary" onclick="alert('Ürün ekleme özelliği yakında!')">+ Yeni Ürün</button>
    </div>
    
    <div id="productsContainer">
      <div style="text-align:center;padding:40px;color:var(--text-muted);">
        <div class="loading"></div>
        <p style="margin-top:16px;">Ürünler yükleniyor...</p>
      </div>
    </div>
  </div>
</div>

<script type="module">
  import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
  import { getAuth, onAuthStateChanged, signOut } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';
  import { getDatabase, ref, onValue } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js';

  // Firebase config
  const firebaseConfig = {
    apiKey: "AIzaSyADykV8-GjNNoK30CUkPlqCNMjR7Ggc1M8",
    authDomain: "e-imza-4c867.firebaseapp.com",
    databaseURL: "https://e-imza-4c867-default-rtdb.firebaseio.com",
    projectId: "e-imza-4c867",
    storageBucket: "e-imza-4c867.firebasestorage.app",
    messagingSenderId: "856535109805",
    appId: "1:856535109805:web:39f6fa2e23275f7be77624"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const database = getDatabase(app);
  
  let products = {};

  // Auth check
  onAuthStateChanged(auth, (user) => {
    if (user) {
      document.getElementById('userEmail').textContent = user.email;
      loadProducts();
    } else {
      window.location.href = '/site/giris.html';
    }
  });

  // Load products
  function loadProducts() {
    const productsRef = ref(database, 'products');
    
    onValue(productsRef, (snapshot) => {
      products = snapshot.val() || {};
      renderProducts();
      updateStats();
    });
  }

  // Render products
  function renderProducts() {
    const container = document.getElementById('productsContainer');
    
    if (Object.keys(products).length === 0) {
      container.innerHTML = `
        <div style="text-align:center;padding:40px;color:var(--text-muted);">
          <p>Henüz ürün eklenmemiş.</p>
        </div>
      `;
      return;
    }
    
    const productsArray = Object.entries(products).map(([id, data]) => ({ id, ...data }));
    
    let html = '<div class="products-grid">';
    
    productsArray.forEach(product => {
      const statusBadge = product.status === 'active' 
        ? '<span class="badge badge-success">Aktif</span>' 
        : '<span class="badge badge-warning">Pasif</span>';
      
      html += `
        <div class="product-card">
          <div class="product-name">${product.name}</div>
          <div class="product-price">${product.price}₺ <span style="font-size:0.7rem;color:var(--text-muted);">+KDV</span></div>
          <div style="margin:8px 0;">
            <span style="color:var(--text-muted);">⏱ ${product.duration}</span>
            ${statusBadge}
          </div>
          ${product.description ? `<p style="font-size:0.85rem;color:var(--text-muted);margin-top:8px;">${product.description}</p>` : ''}
          <div class="product-actions">
            <button class="btn btn-primary" style="flex:1;padding:8px;" onclick="alert('Düzenleme özelliği yakında!')">Düzenle</button>
          </div>
        </div>
      `;
    });
    
    html += '</div>';
    container.innerHTML = html;
  }

  // Update stats
  function updateStats() {
    const productsArray = Object.values(products);
    const total = productsArray.length;
    const active = productsArray.filter(p => p.status === 'active').length;
    const revenue = productsArray.reduce((sum, p) => sum + (parseFloat(p.price) || 0), 0);
    
    document.getElementById('totalProducts').textContent = total;
    document.getElementById('activeProducts').textContent = active;
    document.getElementById('totalRevenue').textContent = revenue.toLocaleString('tr-TR') + '₺';
    document.getElementById('lastUpdate').textContent = new Date().toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' });
  }

  // Logout
  window.logout = async () => {
    if (confirm('Çıkış yapmak istediğinize emin misiniz?')) {
      await signOut(auth);
      window.location.href = '/site/giris.html';
    }
  };
</script>

</body>
</html>
