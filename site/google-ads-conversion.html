<!-- Google Ads Dönüşüm Takibi Komponent -->
<!-- Bu kodu index.html ve ilçe sayfalarının <head> kısmına ekleyin -->

<!-- Google Ads Global Site Tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=AW-XXXXXXXXXX"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'AW-XXXXXXXXXX'); // Buraya Google Ads ID'nizi yazın
</script>

<!-- DÖNÜŞÜM 1: Form Gönderimi -->
<script>
  // Sipariş formu submit olduğunda çalışacak
  function trackFormSubmit() {
    gtag('event', 'conversion', {
      'send_to': 'AW-XXXXXXXXXX/AbC-XXXXXXXXXX', // Dönüşüm ID'nizi yazın
      'value': 850.0,
      'currency': 'TRY',
      'transaction_id': ''
    });
  }
</script>

<!-- DÖNÜŞÜM 2: WhatsApp Tıklaması -->
<script>
  function trackWhatsAppClick() {
    gtag('event', 'conversion', {
      'send_to': 'AW-XXXXXXXXXX/XyZ-XXXXXXXXXX', // WhatsApp dönüşüm ID
      'value': 1.0,
      'currency': 'TRY'
    });
  }
  
  // Tüm WhatsApp linklerine otomatik ekle
  document.addEventListener('DOMContentLoaded', function() {
    var waLinks = document.querySelectorAll('a[href*="wa.me"], a[href*="whatsapp"]');
    waLinks.forEach(function(link) {
      link.addEventListener('click', trackWhatsAppClick);
    });
  });
</script>

<!-- DÖNÜŞÜM 3: Telefon Tıklaması -->
<script>
  function trackPhoneClick() {
    gtag('event', 'conversion', {
      'send_to': 'AW-XXXXXXXXXX/DeF-XXXXXXXXXX', // Telefon dönüşüm ID
      'value': 1.0,
      'currency': 'TRY'
    });
  }
  
  // Tüm telefon linklerine otomatik ekle
  document.addEventListener('DOMContentLoaded', function() {
    var phoneLinks = document.querySelectorAll('a[href^="tel:"]');
    phoneLinks.forEach(function(link) {
      link.addEventListener('click', trackPhoneClick);
    });
  });
</script>

<!-- DÖNÜŞÜM 4: Fiyat Sayfası Görüntüleme (Micro-Conversion) -->
<script>
  // Sadece fiyatlandirma.html sayfasına ekleyin
  if (window.location.pathname.includes('fiyatlandirma')) {
    gtag('event', 'conversion', {
      'send_to': 'AW-XXXXXXXXXX/GhI-XXXXXXXXXX', // Fiyat görüntüleme dönüşüm ID
      'value': 1.0,
      'currency': 'TRY'
    });
  }
</script>

<!-- 
KURULUM NOTLARI:

1. Google Ads hesabınızdan:
   - Araçlar ve Ayarlar > Ölçüm > Dönüşümler
   - + Yeni Dönüşüm Eylemi
   - Web Sitesi seçin
   - Dönüşüm kategori: Müşteri Adayı (Lead)
   
2. Her dönüşüm için ayrı kod alın:
   - Form gönderimi (Ana dönüşüm)
   - WhatsApp tıklaması (İkincil)
   - Telefon araması (İkincil)
   - Fiyat sayfası görüntüleme (Micro)

3. AW-XXXXXXXXXX kodlarını yukarıdaki script'lere yapıştırın

4. Test edin:
   - Google Ads > Araçlar > Google Tag Assistant
   - Sayfanızı ziyaret edin
   - Dönüşüm eylemlerini test edin

5. 24-48 saat sonra Google Ads'de dönüşümleri görmeye başlarsınız
-->
