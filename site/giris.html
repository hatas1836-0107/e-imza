<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Giriş | Zirve E-İmza</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%234f46e5'/%3E%3Cstop offset='1' stop-color='%237c3aed'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='24' height='24' rx='6' fill='url(%23g)'/%3E%3Cpath d='M5 16 c3-6 5 -2 7 -7 c1.5 3 2 5 3.5 2' stroke='white' stroke-width='2' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
:root {
  --primary: #4f46e5;
  --secondary: #7c3aed;
  --success: #22c55e;
  --danger: #f43f5e;
  --bg: #0b0e1a;
  --surface: rgba(255,255,255,0.05);
  --border: rgba(255,255,255,0.12);
  --text: #f3f4f8;
  --text-muted: #7d81a0;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  position: relative;
  overflow: hidden;
}

.mesh-bg {
  position: fixed;
  inset: 0;
  background: 
    radial-gradient(circle at 20% 30%, rgba(79,70,229,0.15) 0%, transparent 40%),
    radial-gradient(circle at 80% 70%, rgba(124,58,237,0.15) 0%, transparent 40%);
  pointer-events: none;
  z-index: 0;
}

.grain {
  position: fixed;
  inset: 0;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='4' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.03'/%3E%3C/svg%3E");
  pointer-events: none;
  opacity: 0.5;
  z-index: 0;
}

.login-container {
  position: relative;
  z-index: 1;
  width: 100%;
  max-width: 420px;
}

.login-box {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 24px;
  padding: 48px 40px;
  backdrop-filter: blur(20px);
  box-shadow: 0 20px 60px rgba(0,0,0,0.4);
}

.logo {
  width: 60px;
  height: 60px;
  margin: 0 auto 24px;
  background: linear-gradient(135deg, var(--primary), var(--secondary));
  border-radius: 16px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 2rem;
}

h1 {
  text-align: center;
  font-size: 1.8rem;
  margin-bottom: 8px;
  background: linear-gradient(135deg, var(--primary), var(--secondary));
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}

.subtitle {
  text-align: center;
  color: var(--text-muted);
  font-size: 0.95rem;
  margin-bottom: 32px;
}

.btn {
  width: 100%;
  padding: 14px 24px;
  border: none;
  border-radius: 12px;
  font-size: 1rem;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.3s;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
}

.btn-google {
  background: white;
  color: #333;
  margin-bottom: 16px;
}

.btn-google:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 24px rgba(0,0,0,0.15);
}

.btn-primary {
  background: linear-gradient(135deg, var(--primary), var(--secondary));
  color: white;
}

.btn-primary:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 24px rgba(79,70,229,0.4);
}

.divider {
  display: flex;
  align-items: center;
  text-align: center;
  margin: 24px 0;
  color: var(--text-muted);
  font-size: 0.9rem;
}

.divider::before,
.divider::after {
  content: '';
  flex: 1;
  border-bottom: 1px solid var(--border);
}

.divider span {
  padding: 0 16px;
}

.form-group {
  margin-bottom: 20px;
}

.form-group label {
  display: block;
  margin-bottom: 8px;
  font-weight: 500;
  color: var(--text-muted);
  font-size: 0.9rem;
}

.form-group input {
  width: 100%;
  padding: 14px 16px;
  background: rgba(255,255,255,0.05);
  border: 1px solid var(--border);
  border-radius: 12px;
  color: var(--text);
  font-size: 1rem;
  transition: all 0.3s;
}

.form-group input:focus {
  outline: none;
  border-color: var(--primary);
  background: rgba(255,255,255,0.08);
  box-shadow: 0 0 0 3px rgba(79,70,229,0.1);
}

.alert {
  padding: 14px 16px;
  border-radius: 12px;
  margin-bottom: 20px;
  font-size: 0.9rem;
  display: flex;
  align-items: start;
  gap: 8px;
}

.alert-success {
  background: rgba(34,197,94,0.15);
  border: 1px solid rgba(34,197,94,0.3);
  color: var(--success);
}

.alert-error {
  background: rgba(244,63,94,0.15);
  border: 1px solid rgba(244,63,94,0.3);
  color: var(--danger);
}

.loading {
  display: inline-block;
  width: 20px;
  height: 20px;
  border: 3px solid rgba(255,255,255,0.2);
  border-radius: 50%;
  border-top-color: currentColor;
  animation: spin 0.8s linear infinite;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

.back-link {
  display: block;
  text-align: center;
  margin-top: 24px;
  color: var(--text-muted);
  text-decoration: none;
  font-size: 0.9rem;
  transition: color 0.3s;
}

.back-link:hover {
  color: var(--primary);
}

@media (max-width: 480px) {
  .login-box {
    padding: 32px 24px;
  }
  
  h1 {
    font-size: 1.5rem;
  }
}
</style>
</head>
<body>
<div class="mesh-bg" aria-hidden="true"></div>
<div class="grain" aria-hidden="true"></div>

<div class="login-container">
  <div class="login-box">
    <div class="logo">⚡</div>
    <h1>Hoş Geldiniz</h1>
    <p class="subtitle">Admin veya kurye hesabınızla giriş yapın</p>
    
    <div id="message"></div>
    
    <!-- Google Sign-In -->
    <button id="googleBtn" class="btn btn-google">
      <svg width="20" height="20" viewBox="0 0 18 18">
        <path fill="#4285F4" d="M16.51 8H8.98v3h4.3c-.18 1-.74 1.48-1.6 2.04v2.01h2.6a7.8 7.8 0 0 0 2.38-5.88c0-.57-.05-.66-.15-1.18Z"/>
        <path fill="#34A853" d="M8.98 17c2.16 0 3.97-.72 5.3-1.94l-2.6-2a4.8 4.8 0 0 1-7.18-2.54H1.83v2.07A8 8 0 0 0 8.98 17Z"/>
        <path fill="#FBBC05" d="M4.5 10.52a4.8 4.8 0 0 1 0-3.04V5.41H1.83a8 8 0 0 0 0 7.18l2.67-2.07Z"/>
        <path fill="#EA4335" d="M8.98 4.18c1.17 0 2.23.4 3.06 1.2l2.3-2.3A8 8 0 0 0 1.83 5.4L4.5 7.49a4.77 4.77 0 0 1 4.48-3.3Z"/>
      </svg>
      <span id="googleBtnText">Google ile Giriş Yap</span>
    </button>
    
    <div class="divider"><span>veya</span></div>
    
    <!-- Email/Password Login -->
    <form id="loginForm">
      <div class="form-group">
        <label>E-posta</label>
        <input type="email" id="email" required placeholder="ornek@zirveeimza.com">
      </div>
      <div class="form-group">
        <label>Şifre</label>
        <input type="password" id="password" required placeholder="••••••••">
      </div>
      <button type="submit" class="btn btn-primary">
        <span id="loginBtnText">Giriş Yap</span>
      </button>
    </form>
    
    <a href="/index.html" class="back-link">← Ana Sayfaya Dön</a>
  </div>
</div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
import { getAuth, signInWithEmailAndPassword, signInWithPopup, GoogleAuthProvider } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';
import { getDatabase, ref, get } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js';

// Firebase config
import { firebaseConfig } from './admin/firebase-config.js';

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const database = getDatabase(app);
const googleProvider = new GoogleAuthProvider();

// Helper functions
function showMessage(msg, type = 'error') {
  const messageDiv = document.getElementById('message');
  messageDiv.innerHTML = `<div class="alert alert-${type}">${msg}</div>`;
}

async function checkUserRole(email) {
  // Check if user is a courier
  const courierKey = email.replace(/[.@]/g, '_');
  const courierRef = ref(database, `couriers/${courierKey}`);
  const courierSnap = await get(courierRef);
  
  if (courierSnap.exists()) {
    return 'courier';
  }
  
  return 'admin';
}

function redirectUser(role) {
  if (role === 'courier') {
    window.location.href = '/site/admin/kurye.html';
  } else {
    window.location.href = '/site/admin/index.html';
  }
}

// Google Login
document.getElementById('googleBtn').addEventListener('click', async () => {
  const btnText = document.getElementById('googleBtnText');
  btnText.innerHTML = '<div class="loading"></div>';
  
  try {
    const result = await signInWithPopup(auth, googleProvider);
    const user = result.user;
    
    showMessage('Giriş başarılı! Yönlendiriliyorsunuz...', 'success');
    
    const role = await checkUserRole(user.email);
    setTimeout(() => redirectUser(role), 1000);
    
  } catch (error) {
    console.error('Google login error:', error);
    
    let errorMsg = 'Google ile giriş başarısız!';
    if (error.code === 'auth/popup-closed-by-user') {
      errorMsg = 'Giriş penceresi kapatıldı.';
    } else if (error.code === 'auth/popup-blocked') {
      errorMsg = 'Pop-up engellendi. Lütfen tarayıcı ayarlarınızı kontrol edin.';
    }
    
    showMessage(errorMsg, 'error');
    btnText.textContent = 'Google ile Giriş Yap';
  }
});

// Email/Password Login
document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const btnText = document.getElementById('loginBtnText');
  
  btnText.innerHTML = '<div class="loading"></div>';
  
  try {
    const result = await signInWithEmailAndPassword(auth, email, password);
    const user = result.user;
    
    showMessage('Giriş başarılı! Yönlendiriliyorsunuz...', 'success');
    
    const role = await checkUserRole(user.email);
    setTimeout(() => redirectUser(role), 1000);
    
  } catch (error) {
    console.error('Login error:', error);
    
    let errorMsg = 'Giriş başarısız!';
    if (error.code === 'auth/wrong-password' || error.code === 'auth/user-not-found') {
      errorMsg = 'E-posta veya şifre hatalı!';
    } else if (error.code === 'auth/invalid-email') {
      errorMsg = 'Geçersiz e-posta adresi!';
    } else if (error.code === 'auth/too-many-requests') {
      errorMsg = 'Çok fazla başarısız deneme. Lütfen daha sonra tekrar deneyin.';
    } else if (error.code === 'auth/invalid-credential') {
      errorMsg = 'Geçersiz e-posta veya şifre!';
    }
    
    showMessage(errorMsg, 'error');
    btnText.textContent = 'Giriş Yap';
  }
});

console.log('✅ Giriş sayfası yüklendi');
</script>
</body>
</html>
