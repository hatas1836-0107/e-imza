<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>USB 3D Test</title>
<style>
body {
  margin: 0;
  background: #0a0a0a;
  color: white;
  font-family: sans-serif;
  overflow-x: hidden;
}

.section {
  height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 3rem;
  font-weight: bold;
}

#usb-3d-stage {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100vh;
  z-index: -1;
}

.debug {
  position: fixed;
  top: 20px;
  right: 20px;
  background: rgba(0,0,0,0.8);
  padding: 20px;
  border-radius: 10px;
  font-size: 14px;
  z-index: 1000;
}

.debug div {
  margin: 5px 0;
}
</style>
</head>
<body>

<div id="usb-3d-stage"></div>

<div class="debug" id="debug">
  <div>Scroll: <span id="scroll-val">0%</span></div>
  <div>Phase: <span id="phase-val">-</span></div>
  <div>Model: <span id="model-val">Loading...</span></div>
</div>

<div class="section" style="background: linear-gradient(180deg, #1a0033 0%, #0a0a0a 100%);">
  SCROLL AŞAĞI<br>↓
</div>

<div class="section" style="background: #0a0a0a;">
  Phase 1-2<br>Distant → Right
</div>

<div class="section" style="background: #0f0f0f;">
  Phase 3<br>Vertical Climb
</div>

<div class="section" style="background: #0a0a0a;">
  Phase 4<br>Center Spin
</div>

<div class="section" style="background: #0f0f0f;">
  Phase 5<br>Slide Left
</div>

<div class="section" style="background: #0a0a0a;">
  Phase 6<br>Vertical Drop
</div>

<div class="section" style="background: #0f0f0f;">
  Phase 7-8<br>Return & Finale
</div>

<div class="section" style="background: linear-gradient(180deg, #0a0a0a 0%, #1a0033 100%);">
  SON<br>↑ YUKARI SCROLL
</div>

<script src="assets/js/usb-3d-viewer.js"></script>
<script>
// Debug display
window.addEventListener('scroll', () => {
  const scrollTop = window.scrollY;
  const maxScroll = document.documentElement.scrollHeight - window.innerHeight;
  const progress = (scrollTop / maxScroll * 100).toFixed(1);
  
  document.getElementById('scroll-val').textContent = progress + '%';
  
  const p = scrollTop / maxScroll;
  let phase = '';
  if (p < 0.15) phase = '1: Distant Intro';
  else if (p < 0.28) phase = '2: Slide Right';
  else if (p < 0.40) phase = '3: Vertical Climb';
  else if (p < 0.52) phase = '4: Center Spin';
  else if (p < 0.64) phase = '5: Slide Left';
  else if (p < 0.76) phase = '6: Vertical Drop';
  else if (p < 0.88) phase = '7: Return Center';
  else phase = '8: Hero Finale';
  
  document.getElementById('phase-val').textContent = phase;
});

// Init viewer
if (typeof initUSB3DViewer === 'function') {
  initUSB3DViewer('usb-3d-stage');
  
  setTimeout(() => {
    document.getElementById('model-val').textContent = 'Loaded!';
    document.getElementById('model-val').style.color = '#0f0';
  }, 2000);
} else {
  document.getElementById('model-val').textContent = 'ERROR!';
  document.getElementById('model-val').style.color = '#f00';
}
</script>

</body>
</html>
