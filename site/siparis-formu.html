<!DOCTYPE html>
<html lang="tr" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sipariş Oluştur | İmza İstanbul</title>
<link rel="stylesheet" href="assets/css/style.css">
<style>
.order-modal {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: rgba(0,0,0,0.8);
  backdrop-filter: blur(8px);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 10000;
  padding: 20px;
  overflow-y: auto;
}

.order-form {
  background: var(--surface, #1a1d2e);
  border: 1px solid var(--border, rgba(255,255,255,0.1));
  border-radius: 24px;
  padding: 40px;
  max-width: 600px;
  width: 100%;
  box-shadow: 0 20px 60px rgba(0,0,0,0.5);
}

.order-form h2 {
  font-size: 2rem;
  margin-bottom: 12px;
  background: linear-gradient(135deg, #4f46e5, #7c3aed);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}

.order-form p {
  color: var(--text-muted, #9ca3af);
  margin-bottom: 32px;
}

.form-group {
  margin-bottom: 24px;
}

.form-group label {
  display: block;
  font-weight: 600;
  margin-bottom: 8px;
  color: var(--text, #f3f4f6);
}

.form-group input,
.form-group select,
.form-group textarea {
  width: 100%;
  padding: 14px 16px;
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 12px;
  color: var(--text, #f3f4f6);
  font-size: 1rem;
  font-family: inherit;
  transition: all 0.3s;
}

.form-group input:focus,
.form-group select:focus,
.form-group textarea:focus {
  outline: none;
  border-color: #4f46e5;
  box-shadow: 0 0 0 3px rgba(79,70,229,0.1);
}

.form-group textarea {
  min-height: 100px;
  resize: vertical;
}

.form-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
}

.btn-submit {
  width: 100%;
  padding: 16px;
  background: linear-gradient(135deg, #4f46e5, #7c3aed);
  color: white;
  border: none;
  border-radius: 12px;
  font-size: 1.1rem;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.3s;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}

.btn-submit:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 24px rgba(79,70,229,0.4);
}

.btn-submit:disabled {
  opacity: 0.6;
  cursor: not-allowed;
}

.alert {
  padding: 16px;
  border-radius: 12px;
  margin-bottom: 24px;
  font-size: 0.95rem;
}

.alert-success {
  background: rgba(34,197,94,0.1);
  border: 1px solid rgba(34,197,94,0.3);
  color: #22c55e;
}

.alert-error {
  background: rgba(244,63,94,0.1);
  border: 1px solid rgba(244,63,94,0.3);
  color: #f43f5e;
}

.loading {
  display: inline-block;
  width: 20px;
  height: 20px;
  border: 3px solid rgba(255,255,255,0.3);
  border-radius: 50%;
  border-top-color: white;
  animation: spin 0.6s linear infinite;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

@media (max-width: 640px) {
  .order-form {
    padding: 24px;
  }
  
  .form-row {
    grid-template-columns: 1fr;
  }
}
</style>
</head>
<body>

<div class="order-modal">
  <div class="order-form">
    <h2>📦 Sipariş Oluştur</h2>
    <p>Formu doldurun, bilgileriniz kaydedilsin ve WhatsApp'tan devam edin.</p>
    
    <div id="messageContainer"></div>
    
    <form id="orderForm">
      <div class="form-group">
        <label>Ad Soyad *</label>
        <input type="text" id="customerName" required placeholder="Ahmet Yılmaz">
      </div>
      
      <div class="form-row">
        <div class="form-group">
          <label>Telefon *</label>
          <input type="tel" id="customerPhone" required placeholder="0532 123 45 67">
        </div>
        
        <div class="form-group">
          <label>E-posta *</label>
          <input type="email" id="customerEmail" required placeholder="ornek@mail.com">
        </div>
      </div>
      
      <div class="form-group">
        <label>Ürün Seçimi *</label>
        <select id="productSelection" required>
          <option value="">Yükleniyor...</option>
        </select>
      </div>
      
      <div class="form-group">
        <label>Teslimat Adresi *</label>
        <textarea id="address" required placeholder="Mahalle, sokak, bina no, daire..."></textarea>
      </div>
      
      <div class="form-row">
        <div class="form-group">
          <label>İlçe *</label>
          <input type="text" id="district" required placeholder="Ataşehir">
        </div>
        
        <div class="form-group">
          <label>İl</label>
          <input type="text" id="city" value="İstanbul" readonly>
        </div>
      </div>
      
      <div class="form-group">
        <label>Not (Opsiyonel)</label>
        <textarea id="notes" rows="3" placeholder="Ek bilgi, talep..."></textarea>
      </div>
      
      <button type="submit" class="btn-submit" id="submitBtn">
        <span id="btnText">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .3 2 .6 2.9a2 2 0 0 1-.5 2.1L8 10a16 16 0 0 0 6 6l1.3-1.2a2 2 0 0 1 2.1-.5c.9.3 1.9.5 2.9.6a2 2 0 0 1 1.7 2Z"/>
          </svg>
          Kaydet ve WhatsApp'a Geç
        </span>
      </button>
    </form>
  </div>
</div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
import { getDatabase, ref, set, push, get, onValue } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js';
import { firebaseConfig } from './admin/firebase-config.js';

// Firebase başlat
const app = initializeApp(firebaseConfig);
const database = getDatabase(app);

// Ürünleri yükle
async function loadProducts() {
  const productSelect = document.getElementById('productSelection');
  
  try {
    const productsRef = ref(database, 'products');
    const snapshot = await get(productsRef);
    
    if (snapshot.exists()) {
      const products = snapshot.val();
      const productsArray = Object.entries(products)
        .map(([id, data]) => ({ id, ...data }))
        .filter(p => p.status === 'active') // Sadece aktif ürünler
        .sort((a, b) => (b.popular ? 1 : 0) - (a.popular ? 1 : 0)); // Popülerler önce
      
      productSelect.innerHTML = '<option value="">Ürün seçiniz</option>';
      
      productsArray.forEach(product => {
        const option = document.createElement('option');
        const popularTag = product.popular ? ' ⭐ Popüler' : '';
        option.value = `${product.name} - ${product.price}₺ (${product.duration})`;
        option.textContent = `${product.name} - ${product.price}₺ +KDV${popularTag}`;
        productSelect.appendChild(option);
      });
    } else {
      productSelect.innerHTML = '<option value="">Ürün bulunamadı</option>';
    }
  } catch (error) {
    console.error('Ürün yükleme hatası:', error);
    productSelect.innerHTML = '<option value="">Yükleme hatası</option>';
  }
}

// Sayfa yüklendiğinde ürünleri getir
loadProducts();

// Takip kodu oluştur
function generateTrackingCode() {
  const year = new Date().getFullYear();
  const random = Math.floor(Math.random() * 9000) + 1000;
  return `ZE-${year}-${random}`;
}

// Form submit
document.getElementById('orderForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  
  const submitBtn = document.getElementById('submitBtn');
  const btnText = document.getElementById('btnText');
  const messageContainer = document.getElementById('messageContainer');
  
  // Button disable
  submitBtn.disabled = true;
  btnText.innerHTML = '<div class="loading"></div> Kaydediliyor...';
  messageContainer.innerHTML = '';
  
  try {
    // Form verileri
    const customerName = document.getElementById('customerName').value.trim();
    const customerPhone = document.getElementById('customerPhone').value.trim();
    const customerEmail = document.getElementById('customerEmail').value.trim();
    const productName = document.getElementById('productSelection').value;
    const address = document.getElementById('address').value.trim();
    const district = document.getElementById('district').value.trim();
    const city = document.getElementById('city').value.trim();
    const notes = document.getElementById('notes').value.trim();
    
    // Takip kodu oluştur
    const trackingCode = generateTrackingCode();
    
    // Firebase'e kaydet
    const orderRef = ref(database, `orders/${trackingCode}`);
    
    const orderData = {
      id: trackingCode,
      customerName,
      customerPhone,
      customerEmail,
      productName,
      address: `${address}, ${district}, ${city}`,
      district,
      city,
      notes,
      status: 'pending',
      createdAt: new Date().toISOString(),
      updatedAt: new Date().toISOString(),
      history: [{
        status: 'Sipariş Alındı',
        timestamp: new Date().toISOString(),
        note: 'Müşteri sipariş formunu doldurdu.'
      }]
    };
    
    await set(orderRef, orderData);
    
    // Başarı mesajı
    messageContainer.innerHTML = `
      <div class="alert alert-success">
        ✅ Sipariş kaydedildi!<br>
        <strong>Takip Numaranız: ${trackingCode}</strong><br>
        <small>Bu numarayı not alın. 2 saniye sonra WhatsApp'a yönlendirileceksiniz...</small>
      </div>
    `;
    
    // WhatsApp mesajı
    const whatsappMessage = encodeURIComponent(
      `Merhaba! Sipariş oluşturdum 👇\n\n` +
      `📋 Takip No: ${trackingCode}\n` +
      `👤 Ad Soyad: ${customerName}\n` +
      `📱 Telefon: ${customerPhone}\n` +
      `📦 Ürün: ${productName}\n` +
      `📍 Adres: ${address}, ${district}, ${city}\n` +
      `${notes ? `📝 Not: ${notes}\n` : ''}` +
      `\nDetaylı bilgi almak istiyorum.`
    );
    
    // 2 saniye bekle ve WhatsApp'a yönlendir
    setTimeout(() => {
      window.location.href = `https://wa.me/905453863407?text=${whatsappMessage}`;
    }, 2000);
    
  } catch (error) {
    console.error('Sipariş oluşturma hatası:', error);
    messageContainer.innerHTML = `
      <div class="alert alert-error">
        ❌ Hata: ${error.message}<br>
        <small>Lütfen tekrar deneyin veya doğrudan WhatsApp'tan yazın.</small>
      </div>
    `;
    
    submitBtn.disabled = false;
    btnText.innerHTML = `
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .3 2 .6 2.9a2 2 0 0 1-.5 2.1L8 10a16 16 0 0 0 6 6l1.3-1.2a2 2 0 0 1 2.1-.5c.9.3 1.9.5 2.9.6a2 2 0 0 1 1.7 2Z"/>
      </svg>
      Kaydet ve WhatsApp'a Geç
    `;
  }
});
</script>

</body>
</html>
