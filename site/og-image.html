<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1200, initial-scale=1">
<title>Zirve E-İmza OG Image</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  width: 1200px;
  height: 630px;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  background: linear-gradient(135deg, #0b0e1a 0%, #1a1f35 50%, #0b0e1a 100%);
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  overflow: hidden;
}
.mesh-bg {
  position: absolute;
  inset: 0;
  background: 
    radial-gradient(circle at 20% 30%, rgba(79, 70, 229, 0.15) 0%, transparent 50%),
    radial-gradient(circle at 80% 70%, rgba(124, 58, 237, 0.15) 0%, transparent 50%);
  filter: blur(60px);
}
.grain {
  position: absolute;
  inset: 0;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.05'/%3E%3C/svg%3E");
  opacity: 0.3;
}
.container {
  position: relative;
  z-index: 10;
  text-align: center;
  padding: 60px;
  max-width: 1000px;
}
.logo {
  display: inline-flex;
  align-items: center;
  gap: 16px;
  margin-bottom: 40px;
}
.logo-icon {
  width: 80px;
  height: 80px;
  background: linear-gradient(135deg, #4f46e5, #7c3aed);
  border-radius: 20px;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 20px 60px rgba(79, 70, 229, 0.4);
}
.logo-icon svg {
  width: 50px;
  height: 50px;
  stroke: white;
  stroke-width: 2.5;
  fill: none;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.logo-text {
  font-size: 52px;
  font-weight: 700;
  color: #ffffff;
  letter-spacing: -0.02em;
}
h1 {
  font-size: 68px;
  font-weight: 800;
  color: #ffffff;
  line-height: 1.2;
  margin-bottom: 24px;
  letter-spacing: -0.03em;
}
.highlight {
  background: linear-gradient(135deg, #4f46e5, #7c3aed);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
p {
  font-size: 32px;
  color: #b6bad0;
  line-height: 1.5;
  margin-bottom: 40px;
  max-width: 800px;
  margin-left: auto;
  margin-right: auto;
}
.features {
  display: flex;
  gap: 30px;
  justify-content: center;
  flex-wrap: wrap;
}
.feature {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 16px 28px;
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid rgba(255, 255, 255, 0.1);
  border-radius: 16px;
  backdrop-filter: blur(10px);
}
.feature svg {
  width: 28px;
  height: 28px;
  stroke: #7c3aed;
  fill: none;
  stroke-width: 2;
}
.feature span {
  font-size: 22px;
  color: #ffffff;
  font-weight: 600;
}
</style>
</head>
<body>
<div class="mesh-bg"></div>
<div class="grain"></div>
<div class="container">
  <div class="logo">
    <div class="logo-icon">
      <svg viewBox="0 0 24 24">
        <path d="M5 16 c3-6 5 -2 7 -7 c1.5 3 2 5 3.5 2"/>
      </svg>
    </div>
    <div class="logo-text">Zirve E-İmza</div>
  </div>
  
  <h1>
    E-İmza Başvurusu<br>
    <span class="highlight">Aynı Gün Teslimat</span>
  </h1>
  
  <p>
    İstanbul'un 39 ilçesinde kurye ile e-imza teslimatı.<br>
    Nitelikli elektronik imza, bilgisayara anında kurulum.
  </p>
  
  <div class="features">
    <div class="feature">
      <svg viewBox="0 0 24 24">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10Z"/>
        <path d="m9 12 2 2 4-4"/>
      </svg>
      <span>5070 Sayılı Kanuna Uygun</span>
    </div>
    <div class="feature">
      <svg viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="9"/>
        <path d="M12 7v5l3 3"/>
      </svg>
      <span>Aynı Gün Kurye</span>
    </div>
    <div class="feature">
      <svg viewBox="0 0 24 24">
        <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/>
        <circle cx="12" cy="10" r="3"/>
      </svg>
      <span>İstanbul 39 İlçe</span>
    </div>
  </div>
</div>
</body>
</html>
