</head>
<body>

      <span>Zirve E-İmza<small>Aynı Gün Kurye ile Teslim</small></span>
    </a>
    <nav class="main-nav">

      <a href="takip.html">Sipariş Takip</a>

        <span class="icon-moon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg></span>
      </button>
      <button class="nav-toggle" type="button" aria-label="Menüyü aç"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    </div>
  </div>

<main id="main">
<section class="page-hero">
  <div class="container">
    <span class="eyebrow"><span class="dot"></span> İletişim</span>
    <h1>Size ulaşalım, <span class="grad-text">süreci başlatalım</span></h1>
    <p class="hero-lead">Formu doldurun, WhatsApp'tan yazın ya da doğrudan arayın</p>
  </div>
</section>

<section class="section" style="padding-top:10px;">
  <div class="container">
    <div class="grid" style="grid-template-columns:1.3fr 1fr;gap:36px;">
      <div class="glass" style="padding:40px;">
        <h2 style="margin-bottom:20px;">Teklif Formu</h2>
        <form id="quoteForm">
          <input type="hidden" id="konumData" name="Konum">
          <div class="form-grid">
            <div class="form-field">
              <label for="adSoyad">Ad Soyad *</label>
              <input type="text" id="adSoyad" placeholder="Adınız Soyadınız" required>
            </div>
            <div class="form-field">
              <label for="telefon">Telefon *</label>
              <input type="tel" id="telefon" placeholder="05xx xxx xx xx" required>
            </div>
            <div class="form-field full">
              <label for="ilce">İlçe *</label>
              <select id="ilce" required>
                <option value="">İlçenizi seçin</option>
                <option>Adalar</option><option>Arnavutköy</option><option>Ataşehir</option><option>Avcılar</option><option>Bağcılar</option><option>Bahçelievler</option><option>Bakırköy</option><option>Başakşehir</option><option>Bayrampaşa</option><option>Beşiktaş</option><option>Beykoz</option><option>Beylikdüzü</option><option>Beyoğlu</option><option>Büyükçekmece</option><option>Çatalca</option><option>Çekmeköy</option><option>Esenler</option><option>Esenyurt</option><option>Eyüpsultan</option><option>Fatih</option><option>Gaziosmanpaşa</option><option>Güngören</option><option>Kadıköy</option><option>Kağıthane</option><option>Kartal</option><option>Küçükçekmece</option><option>Maltepe</option><option>Pendik</option><option>Sancaktepe</option><option>Sarıyer</option><option>Silivri</option><option>Sultanbeyli</option><option>Sultangazi</option><option>Şile</option><option>Şişli</option><option>Tuzla</option><option>Ümraniye</option><option>Üsküdar</option><option>Zeytinburnu</option>
              </select>
            </div>
            <div class="form-field full">
              <label for="adres">Açık Adres</label>
              <textarea id="adres" placeholder="Açık adresiniz" rows="2"></textarea>
              <button type="button" id="konumBtn" class="btn btn-ghost btn-sm" style="margin-top:8px;">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px;"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>
                Konumu Al
              </button>
              <div id="konumDurum" style="margin-top:8px;font-size:0.85rem;"></div>
            </div>
            <div class="form-field">
              <label for="hizmetTuru">Hizmet Türü</label>
              <select id="hizmetTuru">
                <option>Bireysel E-İmza</option>
                <option>Kurumsal E-İmza</option>
                <option>Mobil İmza</option>
                <option>Yenileme</option>
              </select>
            </div>
            <div class="form-field">
              <label for="teslimat">Teslimat</label>
              <select id="teslimat">
                <option>Aynı Gün Kurye</option>
                <option>Online Teslim</option>
              </select>
            </div>
            <div class="form-field full">
              <label for="mesaj">Mesajınız</label>
              <textarea id="mesaj" placeholder="Eklemek istediğiniz not" rows="3"></textarea>
            </div>
          </div>
          <button type="submit" class="btn btn-primary btn-lg" style="margin-top:22px;">WhatsApp'a Gönder</button>
        </form>
      </div>

      <div class="glass" style="padding:32px;">
        <div style="margin-bottom:20px;">
          <h4 style="margin-bottom:8px;">WhatsApp</h4>
          <a href="https://wa.me/905453863407?text=Merhaba%2C%20e-imza%20hakk%C4%B1nda%20bilgi%20almak%20istiyorum." target="_blank" class="btn btn-whatsapp btn-block">Hemen Yazın</a>
        </div>
        <div style="margin-bottom:20px;">
          <h4 style="margin-bottom:8px;">Telefon</h4>
          <a href="tel:+905453863407" class="btn btn-ghost btn-block">0545 386 34 07</a>
        </div>
        <div>
          <h4 style="margin-bottom:8px;">E-posta</h4>
          <a href="mailto:info@zirveeimza.com" class="btn btn-ghost btn-block">info@zirveeimza.com</a>
        </div>
      </div>
    </div>
  </div>
</section>
</main>

<script>
// Konum alma
document.getElementById('konumBtn').addEventListener('click', function() {
  const durumEl = document.getElementById('konumDurum');
  durumEl.innerHTML = '<span style="color:var(--amber-400);">Konum alınıyor...</span>';
  
  if (!navigator.geolocation) {
    durumEl.innerHTML = '<span style="color:var(--rose-500);">Tarayıcınız konum desteklemiyor</span>';
    return;
  }
  
  navigator.geolocation.getCurrentPosition(
    async (position) => {
      const lat = position.coords.latitude;
      const lng = position.coords.longitude;
      
      try {
        const response = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}&accept-language=tr`);
        const data = await response.json();
        const adres = data.display_name || `${lat}, ${lng}`;
        
        document.getElementById('adres').value = adres;
        document.getElementById('konumData').value = `${lat},${lng}`;
        durumEl.innerHTML = '<span style="color:var(--emerald-400);">✓ Konum alındı!</span>';
      } catch (error) {
        document.getElementById('adres').value = `Konum: ${lat}, ${lng}`;
        document.getElementById('konumData').value = `${lat},${lng}`;
        durumEl.innerHTML = '<span style="color:var(--emerald-400);">✓ Konum alındı!</span>';
      }
    },
    (error) => {
      durumEl.innerHTML = '<span style="color:var(--rose-500);">Konum izni reddedildi</span>';
    }
  );
});

// Form gönderimi
document.getElementById('quoteForm').addEventListener('submit', function(e) {
  e.preventDefault();
  
  const adSoyad = document.getElementById('adSoyad').value;
  const telefon = document.getElementById('telefon').value;
  const ilce = document.getElementById('ilce').value;
  const adres = document.getElementById('adres').value;
  const hizmetTuru = document.getElementById('hizmetTuru').value;
  const teslimat = document.getElementById('teslimat').value;
  const mesaj = document.getElementById('mesaj').value;
  const konum = document.getElementById('konumData').value;
  
  let whatsappMesaj = `*E-İmza Teklif Talebi*\n\n`;
  whatsappMesaj += `*Ad Soyad:* ${adSoyad}\n`;
  whatsappMesaj += `*Telefon:* ${telefon}\n`;
  whatsappMesaj += `*İlçe:* ${ilce}\n`;
  if (adres) whatsappMesaj += `*Adres:* ${adres}\n`;
  if (konum) whatsappMesaj += `*Konum:* https://www.google.com/maps?q=${konum}\n`;
  whatsappMesaj += `*Hizmet:* ${hizmetTuru}\n`;
  whatsappMesaj += `*Teslimat:* ${teslimat}\n`;
  if (mesaj) whatsappMesaj += `*Mesaj:* ${mesaj}\n`;
  
  const encodedMesaj = encodeURIComponent(whatsappMesaj);
  const whatsappURL = `https://wa.me/905453863407?text=${encodedMesaj}`;
  
  window.open(whatsappURL, '_blank');
});
</script>
<script src="assets/js/main.js"></script>
</body>
</html>
