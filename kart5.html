  @keyframes bitfloat{0%{transform:translateY(0);opacity:0;}15%{opacity:1;}85%{opacity:1;}100%{transform:translateY(-160px);opacity:0;}}

  .ring{position:absolute;inset:0;animation:spin 22s linear infinite;transform-box:fill-box;transform-origin:center;}
  @keyframes spin{to{transform:rotate(360deg);}}

  .sigsvg{position:absolute;inset:0;overflow:visible;}
  .sigline{
    stroke-dasharray:100 100;stroke-dashoffset:100;
    animation:draw 1.3s cubic-bezier(.4,0,.2,1) .55s forwards;
  }
  @keyframes draw{to{stroke-dashoffset:0;}}
  .sigchase{
    stroke-dasharray:3 12;opacity:0;

  }
  @keyframes chaseIn{to{opacity:.7;}}
  @keyframes chase{to{stroke-dashoffset:-115;}}
  .pentip{opacity:0;animation:penshow 0s .55s forwards,penfade .4s ease 1.85s forwards;}
  @keyframes penshow{to{opacity:1;}}
  @keyframes penfade{to{opacity:0;}}

  @media (prefers-reduced-motion:reduce){
