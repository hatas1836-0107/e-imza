<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-İmza | Digital Security</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, 'Inter', sans-serif;
            overflow-x: hidden;
        }

        .webgl {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 5;
            pointer-events: none;
            mix-blend-mode: screen;
        }

        .scroll-container {
            position: relative;
            z-index: 10;
            pointer-events: auto;
        }

        .section {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .content {
            max-width: 95%;
            text-align: center;
            opacity: 0;
            position: relative;
            z-index: 1;
            transition: transform 0.3s ease-out;
        }

        .content.visible {
            animation: appear 1.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes appear {
            0% {
                opacity: 0;
                transform: translateY(100px) scale(0.8);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .content h1 {
            font-size: clamp(5rem, 18vw, 15rem);
            font-weight: 900;
            line-height: 0.7;
            letter-spacing: -0.1em;
            margin-bottom: 3rem;
            background: linear-gradient(135deg, #fff 0%, #a78bfa 40%, #ec4899 70%, #22d3ee 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            position: relative;
            transform-style: preserve-3d;
        }

        .content p {
            font-size: clamp(1.5rem, 4vw, 2.5rem);
            line-height: 1.2;
            color: rgba(255, 255, 255, 0.9);
            font-weight: 600;
            transform-style: preserve-3d;
        }

        .section:nth-child(1) .content { text-align: left; padding-left: 5%; animation-delay: 0s; }
        .section:nth-child(2) .content { text-align: right; padding-right: 5%; animation-delay: 0.2s; }
        .section:nth-child(3) .content { text-align: center; animation-delay: 0.4s; }
        .section:nth-child(4) .content { text-align: left; padding-left: 8%; animation-delay: 0.6s; }
        .section:nth-child(5) .content { text-align: center; animation-delay: 0.8s; }

        @media (max-width: 968px) {
            .content { text-align: center !important; padding: 0 5% !important; }
        }
    </style>
</head>
<body>
    <canvas class="webgl"></canvas>

    <main class="scroll-container">
        <section class="section" data-section="0">
            <div class="content">
                <h1 class="text-interactive">SİPARİŞİNİZ</h1>
                <p class="text-interactive">E-İmza USB hazırlanıyor</p>
            </div>
        </section>

        <section class="section" data-section="1">
            <div class="content">
                <h1 class="text-interactive">PAKETLEME</h1>
                <p class="text-interactive">Terrarium ambalajında güvende</p>
            </div>
        </section>

        <section class="section" data-section="2">
            <div class="content">
                <h1 class="text-interactive">DEPODAN ÇIKIYOR</h1>
                <p class="text-interactive">Uzay üssünden kalkış</p>
            </div>
        </section>

        <section class="section" data-section="3">
            <div class="content">
                <h1 class="text-interactive">YOLDA</h1>
                <p class="text-interactive">Motor kurye geldi</p>
            </div>
        </section>

        <section class="section" data-section="4">
            <div class="content">
                <h1 class="text-interactive">TESLİMAT</h1>
                <p class="text-interactive">Scooter ile kapınızda</p>
            </div>
        </section>

        <section class="section" data-section="5">
            <div class="content">
                <h1 class="text-interactive">TEŞEKKÜRLER!</h1>
                <p class="text-interactive">Siparişiniz tamamlandı</p>
            </div>
        </section>
    </main>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
    }
    </script>
    <script type="module" src="showcase.js"></script>
</body>
</html>
