<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>API Test</title>
  <style>
    body {
      font-family: monospace;
      max-width: 800px;
      margin: 50px auto;
      padding: 20px;
    }
    button {
      padding: 10px 20px;
      background: #667eea;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    pre {
      background: #f5f5f5;
      padding: 15px;
      border-radius: 5px;
      overflow: auto;
    }
  </style>
</head>
<body>
  <h1>Merchant API Test</h1>
  
  <button onclick="testAPI()">Test API Endpoint</button>
  
  <h3>Response:</h3>
  <pre id="result">Bekliyor...</pre>

  <script>
    async function testAPI() {
      document.getElementById('result').textContent = 'API çağrılıyor...';
      
      try {
        const response = await fetch('/api/merchant-sync-endpoint', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            products: [
              {
                id: 'test-1y',
                name: 'Test E-İmza 1 Yıl',
                price: 950,
                status: 'active'
              }
            ]
          })
        });

        const data = await response.json();
        document.getElementById('result').textContent = JSON.stringify(data, null, 2);
      } catch (error) {
        document.getElementById('result').textContent = `ERROR: ${error.message}`;
      }
    }
  </script>
</body>
</html>
