<!DOCTYPE html>
<html lang="tr" data-theme="light">
<head>
<meta charset="UTF-8">
<title>Başlangıç Ürünlerini Yükle</title>
<style>
body { font-family: system-ui; max-width: 600px; margin: 50px auto; padding: 20px; }
.log { background: #f5f5f5; padding: 15px; border-radius: 8px; margin: 10px 0; font-size: 14px; }
.success { color: #22c55e; }
.error { color: #f43f5e; }
button { padding: 12px 24px; background: #4f46e5; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; }
button:hover { background: #4338ca; }
button:disabled { opacity: 0.5; cursor: not-allowed; }
</style>
</head>
<body>
<h1>Başlangıç Ürünlerini Firebase'e Yükle</h1>
<p>Bu sayfa, sitede gösterilecek örnek ürünleri Firebase'e yükler. Admin panelinden daha sonra düzenleyebilirsiniz.</p>
<button id="loadBtn" onclick="loadProducts()">Ürünleri Yükle</button>
<div id="log"></div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
import { getDatabase, ref, set } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js';

const firebaseConfig = {
  apiKey: "AIzaSyADykV8-GjNNoK30CUkPlqCNMjR7Ggc1M8",
  authDomain: "e-imza-4c867.firebaseapp.com",
  databaseURL: "https://e-imza-4c867-default-rtdb.firebaseio.com",
  projectId: "e-imza-4c867",
  storageBucket: "e-imza-4c867.firebasestorage.app",
  messagingSenderId: "856535109805",
  appId: "1:856535109805:web:39f6fa2e23275f7be77624"
};

const app = initializeApp(firebaseConfig);
const database = getDatabase(app);

const sampleProducts = [
  {
    id: 'product_1',
    name: 'Bireysel E-İmza - 1 Yıl',
    description: 'Bireysel nitelikli e-imza',
    price: 1250,
    duration: '1 yıl',
    features: [
      'Akıllı kart + okuyucu dahil',
      'Bilgisayara online kurulum',
      'Telefonla kurulum desteği'
    ],
    status: 'active',
    imageUrl: '',
    createdAt: new Date().toISOString(),
    updatedAt: new Date().toISOString()
  },
  {
    id: 'product_2',
    name: 'Bireysel E-İmza - 2 Yıl',
    description: 'En çok tercih edilen süre',
    price: 1850,
    duration: '2 yıl',
    features: [
      'Akıllı kart + okuyucu dahil',
      'Aynı gün kurye önceliği',
      'Yerinde kurulum ve test',
      'Ücretsiz telefon desteği'
    ],
    status: 'active',
    imageUrl: '',
    createdAt: new Date().toISOString(),
    updatedAt: new Date().toISOString()
  },
  {
    id: 'product_3',
    name: 'Bireysel E-İmza - 3 Yıl',
    description: 'Uzun vadeli kullanım için',
    price: 2450,
    duration: '3 yıl',
    features: [
      'Akıllı kart + okuyucu dahil',
      'Aynı gün kurye önceliği',
      'Yenileme hatırlatma servisi'
    ],
    status: 'active',
    imageUrl: '',
    createdAt: new Date().toISOString(),
    updatedAt: new Date().toISOString()
  },
  {
    id: 'product_4',
    name: 'Kurumsal E-İmza',
    description: 'Şirketler için özel e-imza çözümü',
    price: 3500,
    duration: '1 yıl',
    features: [
      'Şirketter için özel e-imza çözümü',
      'Toplu kullanım desteği',
      'E-Fatura entegrasyonu',
      '7/24 kurumsal destek'
    ],
    status: 'active',
    imageUrl: '',
    createdAt: new Date().toISOString(),
    updatedAt: new Date().toISOString()
  }
];

window.loadProducts = async () => {
  const btn = document.getElementById('loadBtn');
  const log = document.getElementById('log');
  
  btn.disabled = true;
  log.innerHTML = '<div class="log">Yükleme başlıyor...</div>';

  try {
    for (const product of sampleProducts) {
      await set(ref(database, `products/${product.id}`), product);
      log.innerHTML += `<div class="log success">✓ ${product.name} yüklendi</div>`;
    }
    
    log.innerHTML += '<div class="log success"><strong>✓ Tüm ürünler başarıyla yüklendi!</strong></div>';
    log.innerHTML += '<div class="log">Şimdi <a href="/site/admin/index-modern.html">admin paneline</a> gidip düzenleyebilirsiniz.</div>';
  } catch (error) {
    log.innerHTML += `<div class="log error">✗ Hata: ${error.message}</div>`;
    btn.disabled = false;
  }
};
</script>
</body>
</html>
